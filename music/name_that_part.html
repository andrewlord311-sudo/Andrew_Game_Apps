<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name That Part</title>
    <link rel="preload" href="fonts/fredoka-one.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/quicksand.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="tailwind.css">
    <style>

        body {
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle, #ffe4e6 0%, #fed7aa 100%);
            min-height: 100vh;
        }
        .kids-title {
            font-family: 'Fredoka One', cursive;
        }
        .mascot-bounce { animation: idle-bounce 2s ease-in-out infinite alternate; }
        @keyframes idle-bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
        .mascot-spin { animation: happy-spin 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1; }
        @keyframes happy-spin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.3); } 100% { transform: rotate(360deg) scale(1); } }
        .mascot-sad { animation: sad-shake 0.5s ease-in-out 1; }
        @keyframes sad-shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px) rotate(-5deg); } 40%, 80% { transform: translateX(10px) rotate(5deg); } }
        .confetti { position: absolute; pointer-events: none; width: 12px; height: 12px; border-radius: 50%; animation: blow-up 1s ease-out forwards; }
        @keyframes blow-up { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
        button { touch-action: manipulation; }
    </style>
</head>
<body class="py-2 px-4 flex items-center justify-center">

    <div id="game-card" class="max-w-xl w-full bg-white rounded-3xl shadow-2xl border-4 border-rose-400 p-4 relative overflow-hidden">

        <div class="flex justify-between items-center mb-2">
            <div class="flex gap-2">
                <span class="bg-yellow-100 text-yellow-800 px-3 py-1.5 rounded-full font-bold text-sm shadow-sm flex items-center gap-1">
                    ⭐ Score: <span id="score">0</span>
                </span>
                <span class="bg-orange-100 text-orange-800 px-3 py-1.5 rounded-full font-bold text-sm shadow-sm flex items-center gap-1">
                    🔥 Streak: <span id="streak">0</span>
                </span>
            </div>
            <div class="flex items-center gap-1 text-2xl" id="hearts-container">❤️❤️❤️</div>
        </div>

        <h1 class="kids-title text-3xl text-rose-600 text-center mb-1">Name That Part</h1>
        <p class="text-slate-500 text-center text-sm font-semibold mb-3">Name the glowing part!</p>

        <div class="grid grid-cols-3 gap-2 bg-rose-50 p-2 rounded-2xl mb-2 border border-rose-100">
            <button id="btn-stage-1" onclick="setStage(1)" class="py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 bg-rose-400 text-white border-b-2 border-rose-600 shadow">
                ☀️ Stage 1: Easy
            </button>
            <button id="btn-stage-2" onclick="setStage(2)" class="py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200">
                🌴 Stage 2: Medium
            </button>
            <button id="btn-stage-3" onclick="setStage(3)" class="py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200">
                🚀 Stage 3: Hard
            </button>
        </div>

        <div class="flex items-center gap-3 bg-rose-50 p-2 rounded-2xl border border-rose-100 mb-2">
            <div id="mascot-avatar" class="mascot-bounce shrink-0 transition-transform"></div>
            <div class="relative bg-white border border-rose-100 p-2 rounded-xl shadow-sm w-full">
                <div class="absolute top-1/2 -left-2 w-4 h-4 -translate-y-1/2 rotate-45 bg-white border-l border-b border-rose-50"></div>
                <p id="mascot-dialog" class="text-slate-700 font-bold text-sm leading-snug">
                    Hi, I'm Melody! Can you name the glowing part?
                </p>
            </div>
        </div>

        <div class="relative bg-slate-50 rounded-2xl p-2 border-2 border-slate-200 mb-2 flex justify-center items-center">
            <canvas id="canvas" width="360" height="210" class="max-h-44 w-auto rounded-xl bg-white shadow-inner"></canvas>
            <div id="confetti-holder" class="absolute inset-0 pointer-events-none overflow-hidden rounded-2xl"></div>

            <div id="overlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm rounded-2xl flex flex-col justify-center items-center p-6 text-center hidden transition-opacity duration-300 z-50">
                <div id="overlay-mascot" class="mb-3 mascot-bounce"></div>
                <h3 id="overlay-title" class="kids-title text-3xl text-rose-600 mb-2">Stage Passed!</h3>
                <p id="overlay-msg" class="text-slate-600 font-bold mb-4">Incredible job!</p>
                <button id="overlay-btn" onclick="dismissOverlay()" class="bg-yellow-400 text-slate-800 font-extrabold px-8 py-3 rounded-full border-b-4 border-yellow-600 hover:brightness-105 active:scale-95 transition-all text-lg">
                    Next Challenge!
                </button>
            </div>
        </div>

        <div id="question-text" class="text-center text-lg font-black text-slate-800 mb-2">
            What is the glowing part called?
        </div>

        <div id="feedback" class="text-center text-base font-bold min-h-[24px] text-slate-700 mb-2">
            &nbsp;
        </div>

        <div class="grid grid-cols-1 gap-2 mb-3" id="answer-buttons">
            <!-- injected -->
        </div>

        <div class="flex justify-between items-center text-xs">
            <button onclick="toggleHints()" class="bg-purple-100 text-purple-700 border-b-2 border-purple-300 font-bold px-4 py-2 rounded-xl hover:bg-purple-200">
                💡 <span id="hint-btn-text">Turn Hints On</span>
            </button>
            <button onclick="resetGame()" class="bg-rose-100 text-rose-700 border-b-2 border-rose-300 font-bold px-4 py-2 rounded-xl hover:bg-rose-200">
                🔄 Reset Score
            </button>
        </div>

    </div>
    <script src="auth.js"></script>
    <script src="back-link.js"></script>
    <script src="reward-system.js"></script>
    <script src="game-progress.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // ---- the six names taught in the video "Some musical names" ----
        const TERMS = {
            stave:  { label: 'Stave',       hint: 'All five lines together.',                                color: '#1e293b' },
            clef:   { label: 'Clef',        hint: 'The swirly symbol at the start.',                        color: '#0d9488' },
            note:   { label: 'Note',        hint: 'A little blob with a stick.',                            color: '#b45309' },
            line:   { label: 'Line',        hint: 'A note can sit right on one of these.',                  color: '#0d9488' },
            space:  { label: 'Space',       hint: 'The gap between two lines.',                             color: '#be185d' },
            ledger: { label: 'Ledger line', hint: 'A tiny extra line for notes too high or too low.',       color: '#ea580c' }
        };
        const STAGE_TARGETS = {
            1: ['stave', 'clef', 'note'],
            2: ['stave', 'clef', 'note', 'line', 'space'],
            3: ['stave', 'clef', 'note', 'line', 'space', 'ledger']
        };
        // set to the video's address once it is published, and a "Watch the video" link appears
        const VIDEO_URL = '';

        let currentStage = 1, score = 0, streak = 0, lives = 3;
        let hintsEnabled = false, controlLock = false;
        let round = null, lastTarget = null;

        const dialogs = {
            start: "Hi, I'm Melody! Can you name the glowing part?",
            correct: "Spot on! 🎯",
            incorrect: "Not quite - look at what's glowing again."
        };

        // ---------------- sound ----------------
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playTone(freq, type = 'triangle', duration = 0.5) {
            try {
                const c = getAudioContext(), osc = c.createOscillator(), gain = c.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, c.currentTime);
                gain.gain.setValueAtTime(0, c.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, c.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, c.currentTime + duration);
                osc.connect(gain); gain.connect(c.destination); osc.start(); osc.stop(c.currentTime + duration);
            } catch (e) {}
        }
        function playSuccessArpeggio() {
            try {
                const c = getAudioContext(), now = c.currentTime;
                [261.63, 329.63, 392.00, 523.25].forEach((freq, i) => {
                    const osc = c.createOscillator(), gain = c.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.15, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.25);
                    osc.connect(gain); gain.connect(c.destination); osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.25);
                });
            } catch (e) {}
        }
        function playFailBuzz() { playTone(110, 'sawtooth', 0.35); }
        // Melody and Barnaby say the name (same recordings as the video)
        // loaded only once the game is already playable, so the sound files never compete with first paint
        const NAME_AUDIO = {};
        function preloadNames() { Object.keys(TERMS).forEach(k => { if (!NAME_AUDIO[k]) { const a = new Audio('audio/names/' + k + '.mp3'); a.preload = 'auto'; NAME_AUDIO[k] = a; } }); }
        function sayName(k) { try { preloadNames(); const a = NAME_AUDIO[k]; a.currentTime = 0; a.play().catch(() => {}); } catch (e) {} }

        const SVG_MELODY = `
        <svg viewBox="0 0 100 100" class="w-16 h-16 drop-shadow-md">
            <circle cx="50" cy="50" r="35" fill="#2dd4bf" />
            <path d="M 15,50 A 35,35 0 0,0 50,85 Z" fill="#0d9488" />
            <ellipse cx="40" cy="62" rx="15" ry="12" fill="#ccfbf1" />
            <circle cx="65" cy="40" r="7" fill="#ffffff" />
            <circle cx="67" cy="40" r="3.5" fill="#0f172a" />
            <circle cx="69" cy="38" r="1.5" fill="#ffffff" />
            <polygon points="75,45 90,48 78,55" fill="#fb923c" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M 25,50 C 20,40 35,35 45,50 C 40,60 30,60 25,50 Z" fill="#14b8a6" />
            <path d="M 40,18 Q 30,8 42,12 Q 54,8 44,18" fill="#2dd4bf" />
        </svg>`;

        // ---------------- drawing ----------------
        const GAP = 18, TOP = 70, BOTTOM = TOP + 4 * GAP, X0 = 22, X1 = 338, NOTE_X = 210;
        const lineY = i => BOTTOM - i * GAP;                 // i = 0 (bottom line) .. 4 (top line)
        const stepY = s => BOTTOM - s * (GAP / 2);           // s = 0 on bottom line, each step = half a gap

        function roundRect(x, y, w, h, r) {
            ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
        }
        function drawNote(step, color) {
            const y = stepY(step);
            ctx.save(); ctx.translate(NOTE_X, y); ctx.rotate(-0.2);
            ctx.beginPath(); ctx.ellipse(0, 0, 12, 8.5, 0, 0, 2 * Math.PI); ctx.fillStyle = color; ctx.fill(); ctx.restore();
            ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.beginPath();
            if (step >= 4) { ctx.moveTo(NOTE_X - 11, y + 1); ctx.lineTo(NOTE_X - 11, y + 44); }   // stem down for high notes
            else { ctx.moveTo(NOTE_X + 11, y - 1); ctx.lineTo(NOTE_X + 11, y - 44); }
            ctx.stroke();
        }
        function draw(ts) {
            if (!round) { requestAnimationFrame(draw); return; }
            const t = ts / 1000, pulse = 0.55 + 0.45 * Math.sin(t * 5);
            const col = TERMS[round.target].color;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const glow = (round.target === 'stave');
            ctx.strokeStyle = '#334155'; ctx.lineWidth = glow ? 2.5 + 2.2 * pulse : 2.5;
            for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(X0, lineY(i)); ctx.lineTo(X1, lineY(i)); ctx.stroke(); }
            // clef
            ctx.fillStyle = '#1e293b'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
            ctx.font = `${GAP * 4}px "Noto Music", serif`;
            if (round.clef === 'treble') ctx.fillText('\u{1D11E}', X0 + 8, BOTTOM);
            else ctx.fillText('\u{1D122}', X0 + 8, TOP + 3.625 * GAP);       // same placement as every other game
            // note (if this round has one) and its ledger line
            if (round.note !== null) {
                const y = stepY(round.note);
                if (round.note <= -2 || round.note >= 10) {
                    ctx.strokeStyle = round.target === 'ledger' ? col : '#334155'; ctx.lineWidth = round.target === 'ledger' ? 3.5 + 1.5 * pulse : 2.5;
                    ctx.beginPath(); ctx.moveTo(NOTE_X - 24, y); ctx.lineTo(NOTE_X + 24, y); ctx.stroke();
                }
                drawNote(round.note, round.target === 'note' ? col : '#1e293b');
            }
            // the glowing part
            ctx.save(); ctx.globalAlpha = 0.25 + 0.3 * pulse; ctx.fillStyle = col;
            if (round.target === 'line') {
                roundRect(X0, lineY(round.which) - 7, X1 - X0, 14, 7); ctx.fill();
            } else if (round.target === 'space') {
                roundRect(X0, lineY(round.which + 1) + 5, X1 - X0, GAP - 10, 8); ctx.fill();
            } else if (round.target === 'ledger') {
                const y = stepY(round.note); roundRect(NOTE_X - 34, y - 9, 68, 18, 9); ctx.fill();
            } else if (round.target === 'stave') {
                roundRect(X0 - 8, TOP - 12, X1 - X0 + 16, 4 * GAP + 24, 14); ctx.fill();
            } else if (round.target === 'clef') {
                const top = round.clef === 'treble' ? TOP - 30 : TOP - 10, h = round.clef === 'treble' ? 4 * GAP + 62 : 3.4 * GAP + 20;
                roundRect(X0 + 0, top, 62, h, 16); ctx.fill();
            } else if (round.target === 'note') {
                ctx.beginPath(); ctx.arc(NOTE_X, stepY(round.note), 26, 0, 2 * Math.PI); ctx.fill();
            }
            ctx.restore();
            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);

        // ---------------- game flow ----------------
        function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
        function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

        function newRound() {
            const pool = STAGE_TARGETS[currentStage];
            let target; do { target = pick(pool); } while (target === lastTarget && pool.length > 1);
            lastTarget = target;
            const r = { target, clef: Math.random() < 0.5 ? 'treble' : 'bass', note: null, which: 0 };
            if (target === 'note') r.note = 1 + Math.floor(Math.random() * 7);          // inside the stave
            if (target === 'line') r.which = Math.floor(Math.random() * 5);
            if (target === 'space') r.which = Math.floor(Math.random() * 4);
            if (target === 'ledger') r.note = Math.random() < 0.5 ? 10 : -2;             // one ledger line above or below
            round = r; controlLock = false;
            // answers: the right one plus up to three others from this stage
            const others = shuffle(pool.filter(k => k !== target)).slice(0, Math.min(3, pool.length - 1));
            round.options = shuffle([target, ...others]);
            renderAnswers();
            document.getElementById('mascot-dialog').innerText = dialogs.start;
            const fb = document.getElementById('feedback');
            fb.className = "text-center text-base font-bold min-h-[24px] text-slate-700 mb-2"; fb.innerHTML = "&nbsp;";
        }

        function renderAnswers() {
            const box = document.getElementById('answer-buttons'); box.innerHTML = '';
            box.className = 'grid gap-2 mb-3 ' + (round.options.length === 3 ? 'grid-cols-3' : 'grid-cols-2');
            round.options.forEach(key => {
                const btn = document.createElement('button');
                btn.innerText = TERMS[key].label;
                btn.className = "text-white font-bold text-lg py-4 rounded-2xl border-b-4 active:translate-y-1 active:border-b-0 transition-all shadow";
                btn.style.background = TERMS[key].color; btn.style.borderColor = 'rgba(0,0,0,.35)';
                btn.onclick = () => makeGuess(key);
                box.appendChild(btn);
            });
            if (hintsEnabled) {
                const hint = document.createElement('div');
                hint.className = "col-span-full text-center text-xs font-bold text-purple-600 bg-purple-50 rounded-xl py-1";
                hint.innerText = '💡 ' + TERMS[round.target].hint;
                box.appendChild(hint);
            }
        }

        function makeGuess(answer) {
            if (controlLock) return;
            const fb = document.getElementById('feedback');
            if (answer === round.target) {
                score += 10; streak++;
                Tracking.logAnswer({ correct: true, stage: currentStage });
                RewardSystem.correct();
                document.getElementById('score').innerText = score; document.getElementById('streak').innerText = streak;
                fb.className = "text-center text-base font-bold text-green-600 mb-2"; fb.innerText = "⭐ " + TERMS[answer].label + "! ⭐";
                sayName(answer); triggerConfetti();
                document.getElementById('mascot-dialog').innerText = dialogs.correct;
                controlLock = true; setTimeout(newRound, 1500);
            } else {
                streak = 0; lives--;
                Tracking.logAnswer({ correct: false, stage: currentStage });
                document.getElementById('streak').innerText = streak; updateHearts();
                fb.className = "text-center text-base font-bold text-rose-500 mb-2"; fb.innerText = "Not quite - look at what's glowing again.";
                playFailBuzz(); document.getElementById('mascot-dialog').innerText = dialogs.incorrect;
                controlLock = true; setTimeout(() => { controlLock = false; }, 700);
                if (lives <= 0) setTimeout(triggerGameOver, 900);
            }
        }

        function setStage(n) {
            currentStage = n;
            for (let i = 1; i <= 3; i++) {
                document.getElementById(`btn-stage-${i}`).className = i === n
                    ? "py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 bg-rose-400 text-white border-b-2 border-rose-600 shadow"
                    : "py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200";
            }
            resetStats(); lastTarget = null; newRound();
        }
        // completing an animal (8 correct answers, see reward-system.js) completes a stage
        if (typeof RewardSystem !== 'undefined') RewardSystem.onAnimalComplete(() => { triggerStageComplete(); });

        function triggerConfetti() {
            const holder = document.getElementById('confetti-holder');
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#eab308', '#a855f7', '#ff7849'];
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div'); p.className = 'confetti';
                const ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 120;
                p.style.setProperty('--dx', `${Math.cos(ang) * dist}px`); p.style.setProperty('--dy', `${Math.sin(ang) * dist}px`);
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)]; p.style.left = '50%'; p.style.top = '50%';
                holder.appendChild(p); setTimeout(() => p.remove(), 1000);
            }
        }
        function updateHearts() {
            const c = document.getElementById('hearts-container'); c.innerHTML = '';
            for (let i = 0; i < 3; i++) c.innerHTML += i < lives ? '❤️' : '🖤';
        }
        function triggerStageComplete() {
            GameProgress.stageCleared(currentStage);
            playSuccessArpeggio();
            document.getElementById('overlay-mascot').innerHTML = SVG_MELODY;
            document.getElementById('overlay-title').innerText = "🌟 Sensational! 🌟";
            const msg = document.getElementById('overlay-msg'), btn = document.getElementById('overlay-btn');
            if (currentStage < 3) {
                msg.innerText = `You completed Stage ${currentStage}! Ready for Stage ${currentStage + 1}?`; btn.innerText = "Go to Next Stage!";
                btn.onclick = () => { dismissOverlay(); setStage(currentStage + 1); };
            } else {
                msg.innerText = "Amazing! You know your musical names!"; btn.innerText = "Back to Arcade!";
                btn.onclick = () => { dismissOverlay(); location.href = (window.ARCADE_URL || "music_arcade.html"); };
            }
            document.getElementById('overlay').classList.remove('hidden');
        }
        function triggerGameOver() {
            document.getElementById('overlay-mascot').innerHTML = SVG_MELODY;
            document.getElementById('overlay-title').innerText = "No More Hearts!";
            document.getElementById('overlay-msg').innerText = "Let's take another look and try this stage again!";
            const btn = document.getElementById('overlay-btn');
            btn.innerText = "Restart Stage"; btn.onclick = () => { dismissOverlay(); resetStats(); newRound(); };
            document.getElementById('overlay').classList.remove('hidden');
        }
        function dismissOverlay() { document.getElementById('overlay').classList.add('hidden'); controlLock = false; }
        function resetStats() { streak = 0; lives = 3; document.getElementById('streak').innerText = streak; updateHearts(); }
        function resetGame() { score = 0; document.getElementById('score').innerText = score; setStage(1); }
        function toggleHints() {
            hintsEnabled = !hintsEnabled;
            document.getElementById('hint-btn-text').innerText = hintsEnabled ? "Turn Hints Off" : "Turn Hints On";
            if (round) renderAnswers();
        }

        document.addEventListener('DOMContentLoaded', () => {
            // show the game at once; the clef glyph appears the moment its font arrives (the drawing loop redraws every frame)
            try { const f = new FontFace('Noto Music', 'url(fonts/noto-music.woff2)'); document.fonts.add(f); f.load(); } catch (e) {}
            document.getElementById('mascot-avatar').innerHTML = SVG_MELODY;
            if (VIDEO_URL) {
                const a = document.createElement('a'); a.href = VIDEO_URL; a.target = '_blank'; a.rel = 'noopener';
                a.className = 'block text-center text-xs font-bold text-rose-600 underline mt-2'; a.innerText = '▶ Watch the video: Some musical names';
                document.getElementById('game-card').appendChild(a);
            }
            setStage(1);
            if (window.requestIdleCallback) requestIdleCallback(() => preloadNames()); else setTimeout(preloadNames, 1200);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Ladder: Middle C</title>
    <link rel="preload" href="fonts/fredoka-one.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/quicksand.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/noto-music.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="tailwind.css">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle, #ccfbf1 0%, #fef9c3 100%);
            min-height: 100vh;
        }
        .kids-title { font-family: 'Fredoka One', cursive; }
        .mascot-bounce { animation: idle-bounce 2s ease-in-out infinite alternate; }
        @keyframes idle-bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
        .mascot-spin { animation: happy-spin 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1; }
        @keyframes happy-spin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.3); } 100% { transform: rotate(360deg) scale(1); } }
        .confetti { position: absolute; pointer-events: none; width: 12px; height: 12px; border-radius: 50%; animation: blow-up 1s ease-out forwards; }
        @keyframes blow-up { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
        button { touch-action: manipulation; }

        .white-key { box-shadow: inset 0 -8px 0 #e2e8f0, 0 4px 6px rgba(0,0,0,0.05); transition: background-color 0.15s; }
        .white-key.found { background-color: #86efac !important; box-shadow: inset 0 -8px 0 #16a34a, 0 4px 6px rgba(0,0,0,0.05); }
        .white-key.wrong-flash { background-color: #fca5a5 !important; }
        .white-key.lit { background-color: #fde68a !important; box-shadow: inset 0 -8px 0 #f59e0b, 0 0 0 3px #f59e0b; }
        .black-key { box-shadow: inset 0 -6px 0 #000000, 0 3px 5px rgba(0,0,0,0.3); }
        .key-badge { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 2px 6px; border-radius: 9999px; background: #0d9488; color: #fff;
            font-family: 'Fredoka One', cursive; font-size: 0.7rem; line-height: 1.1rem; text-align: center; border: 2px solid #fff; box-shadow: 0 2px 0 rgba(0,0,0,.2); pointer-events: none; white-space: nowrap; }
    </style>
</head>
<body class="py-2 px-4 flex items-center justify-center">

    <div id="game-card" class="max-w-xl w-full bg-white rounded-3xl shadow-2xl border-4 border-teal-400 p-4 relative overflow-hidden">

        <div class="flex justify-between items-center mb-2">
            <div class="flex gap-2">
                <span class="bg-yellow-100 text-yellow-800 px-3 py-1.5 rounded-full font-bold text-sm shadow-sm flex items-center gap-1">
                    ⭐ Score: <span id="score">0</span>
                </span>
                <span class="bg-orange-100 text-orange-800 px-3 py-1.5 rounded-full font-bold text-sm shadow-sm flex items-center gap-1">
                    🔥 Streak: <span id="streak">0</span>
                </span>
            </div>
            <div class="flex items-center gap-1 text-2xl" id="hearts-container">❤️❤️❤️</div>
        </div>

        <h1 class="kids-title text-3xl text-teal-600 text-center mb-1">Note Ladder: Middle C</h1>
        <p class="text-slate-500 text-center text-sm font-semibold mb-2">Rung 1: find Middle C on the stave and on the keys!</p>

        <div class="grid grid-cols-3 gap-2 bg-teal-50 p-2 rounded-2xl mb-2 border border-teal-100">
            <button id="btn-stage-1" onclick="setStage(1)" class="py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200">🎹 Stage 1: Find it</button>
            <button id="btn-stage-2" onclick="setStage(2)" class="py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200">🎼 Stage 2: On the stave</button>
            <button id="btn-stage-3" onclick="setStage(3)" class="py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200">🌟 Stage 3: On the keys</button>
        </div>

        <div class="flex items-center gap-3 bg-teal-50 p-2 rounded-2xl border border-teal-100 mb-2">
            <div id="mascot-avatar" class="mascot-bounce shrink-0"></div>
            <div class="relative bg-white border border-teal-100 p-2 rounded-xl shadow-sm w-full">
                <div class="absolute top-1/2 -left-2 w-4 h-4 -translate-y-1/2 rotate-45 bg-white border-l border-b border-teal-50"></div>
                <p id="mascot-dialog" class="text-slate-700 font-bold text-sm leading-snug">Hi, I'm Melody! Let's find Middle C!</p>
            </div>
        </div>

        <div class="relative bg-slate-50 rounded-2xl p-2 border-2 border-slate-200 mb-2 flex justify-center items-center">
            <canvas id="canvas" width="320" height="214" class="max-h-48 w-auto rounded-xl bg-white shadow-inner"></canvas>
            <div id="confetti-holder" class="absolute inset-0 pointer-events-none overflow-hidden rounded-2xl"></div>
            <div id="overlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm rounded-2xl flex flex-col justify-center items-center p-6 text-center hidden transition-opacity duration-300 z-50">
                <div id="overlay-mascot" class="mb-3 mascot-bounce"></div>
                <h3 id="overlay-title" class="kids-title text-3xl text-teal-600 mb-2">Stage Passed!</h3>
                <p id="overlay-msg" class="text-slate-600 font-bold mb-4">Incredible job!</p>
                <button id="overlay-btn" onclick="dismissOverlay()" class="bg-yellow-400 text-slate-800 font-extrabold px-8 py-3 rounded-full border-b-4 border-yellow-600 hover:brightness-105 active:scale-95 transition-all text-lg">Next Challenge!</button>
            </div>
        </div>

        <div id="question-text" class="text-center text-lg font-black text-slate-800 mb-1">&nbsp;</div>

        <div id="piano-container" class="relative flex select-none bg-slate-800 p-2 rounded-2xl border-2 border-slate-300 h-28 w-full overflow-hidden mb-2"></div>

        <div class="flex flex-wrap justify-center gap-3 mb-2" id="answer-buttons"></div>

        <div id="feedback" class="text-center text-base font-bold min-h-[24px] text-slate-700 mb-2">&nbsp;</div>

        <div class="flex justify-between items-center text-xs">
            <button onclick="toggleHints()" class="bg-purple-100 text-purple-700 border-b-2 border-purple-300 font-bold px-4 py-2 rounded-xl hover:bg-purple-200">
                💡 <span id="hint-btn-text">Turn Hints On</span>
            </button>
            <button onclick="resetGame()" class="bg-rose-100 text-rose-700 border-b-2 border-rose-300 font-bold px-4 py-2 rounded-xl hover:bg-rose-200">
                🔄 Reset Score
            </button>
        </div>

    </div>
    <script src="mascots.js"></script>
    <script src="auth.js"></script>
    <script src="back-link.js"></script>
    <script src="reward-system.js"></script>
    <script src="hit-counter.js"></script>
    <script src="game-progress.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const canvas = $('canvas'), ctx = canvas.getContext('2d');

        let currentStage = 1, score = 0, streak = 0, lives = 3;
        let hintsEnabled = false, controlLock = false, roundTimer = null;
        let round = null;              // the current question
        let lastKey = null;

        // ---- notes -----------------------------------------------------
        // dia = diatonic step number (C4 = 28). Treble stave bottom line is E4, bass stave top line is A3.
        const L = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
        const dia = id => (+id.slice(-1)) * 7 + L[id[0]];
        const FREQ = { C: 261.63, D: 293.66, E: 329.63, F: 349.23, G: 392.00, A: 440.00, B: 493.88 };
        const freqOf = id => FREQ[id[0]] * Math.pow(2, +id.slice(-1) - 4);
        const WHITES = ['C','D','E','F','G','A','B'];
        const MIDDLE = 'C4';

        // ---- the grand staff -------------------------------------------
        const GAP = 12, STEP = GAP / 2, T_TOP = 30, T_BOT = T_TOP + 4 * GAP;
        const B_TOP = T_BOT + 5 * GAP, B_BOT = B_TOP + 4 * GAP;   // a real gap of five spaces between the staves
        const SX = 36, SW = 252, NOTE_X = 190;
        const yTreble = id => T_BOT - (dia(id) - dia('E4')) * STEP;
        const yBass = id => B_TOP + (dia('A3') - dia(id)) * STEP;

        function line(x1, y, x2, w = 2.5, col = '#334155') { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke(); }
        function drawNote(x, y, col, stemUp) {
            ctx.save(); ctx.translate(x, y); ctx.rotate(-0.25); ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, 0, 11, 7.5, 0, 0, 2 * Math.PI); ctx.fill(); ctx.restore();
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 2.5; ctx.beginPath();
            if (stemUp) { ctx.moveTo(x + 10, y); ctx.lineTo(x + 10, y - 40); } else { ctx.moveTo(x - 10, y); ctx.lineTo(x - 10, y + 40); }
            ctx.stroke();
        }
        // where is this note written? 'T' = on the treble stave, 'B' = on the bass stave
        function drawStaff(note) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 5; i++) { line(SX, T_TOP + i * GAP, SX + SW); line(SX, B_TOP + i * GAP, SX + SW); }
            line(SX, T_TOP, SX, B_BOT, 2.5); line(SX + SW, T_TOP, SX + SW, T_BOT, 2.5); line(SX + SW, B_TOP, SX + SW, B_BOT, 2.5);
            ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'; ctx.fillStyle = '#1e293b';
            ctx.font = `${GAP * 4}px "Noto Music", serif`;
            ctx.fillText('\u{1D11E}', SX + 8, T_TOP + 4 * GAP);
            ctx.fillText('\u{1D122}', SX + 8, B_TOP + 3.625 * GAP);
            if (!note) return;
            const y = note.clef === 'T' ? yTreble(note.id) : yBass(note.id);
            const isMiddle = note.id === MIDDLE;
            // ledger lines: every line position outside the stave that the note sits on or beyond
            const lo = note.clef === 'T' ? T_BOT : B_BOT, hi = note.clef === 'T' ? T_TOP : B_TOP;
            if (y > lo + 1) for (let ly = lo + GAP; ly <= y + 1; ly += GAP) line(NOTE_X - 17, ly, NOTE_X + 17, 3);
            if (y < hi - 1) for (let ly = hi - GAP; ly >= y - 1; ly -= GAP) line(NOTE_X - 17, ly, NOTE_X + 17, 3);
            drawNote(NOTE_X, y, isMiddle && hintsEnabled ? '#0d9488' : '#2563eb', y > (note.clef === 'T' ? T_TOP + 2 * GAP : B_TOP + 2 * GAP) ? true : false);
            if (hintsEnabled && isMiddle) {
                ctx.fillStyle = '#0f766e'; ctx.font = 'bold 13px Quicksand, sans-serif'; ctx.textAlign = 'left';
                ctx.fillText('Middle C', NOTE_X + 24, y + 5);
            }
        }

        // ---- the keyboard (C3 to C5: three Cs, Middle C is the one in the middle) --
        const KEYS = [];
        for (let oct = 3; oct <= 4; oct++) WHITES.forEach(n => KEYS.push(n + oct));
        KEYS.push('C5');
        function renderPiano(lit, found) {
            const c = $('piano-container'); c.innerHTML = '';
            KEYS.forEach(id => {
                const d = document.createElement('div');
                d.className = 'white-key flex-1 min-w-0 bg-white border-r-2 border-slate-200 rounded-b-xl h-full relative select-none cursor-pointer' + (found === id ? ' found' : '') + (lit === id ? ' lit' : '');
                d.dataset.note = id;
                if (found === id) d.innerHTML = '<span class="key-badge">C</span>';
                else if (hintsEnabled && id === MIDDLE && currentStage === 1) d.style.boxShadow = 'inset 0 -8px 0 #fbbf24, 0 0 0 3px #fbbf24';
                d.addEventListener('mousedown', () => pressKey(id, d));
                c.appendChild(d);
            });
            const w = (c.clientWidth - 16) / KEYS.length;
            KEYS.forEach((id, i) => {
                if (i >= KEYS.length - 1) return;
                if (['E', 'B'].includes(id[0])) return;       // no black key after E or B
                const b = document.createElement('div');
                b.className = 'black-key absolute bg-slate-950 rounded-b-lg z-30 select-none cursor-pointer';
                b.style.height = '3.2rem'; b.style.width = `${w * 0.62}px`; b.style.left = `${(i + 1) * w + 8 - w * 0.31}px`;
                c.appendChild(b);
            });
            c.style.pointerEvents = currentStage === 1 ? 'auto' : 'none';
        }

        // ---- sounds ----------------------------------------------------
        let audioCtx = null;
        function getAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
        function playTone(freq, type = 'triangle', dur = 0.6) {
            try { const a = getAudio(), o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
                g.gain.setValueAtTime(0, a.currentTime); g.gain.linearRampToValueAtTime(0.3, a.currentTime + 0.05); g.gain.exponentialRampToValueAtTime(0.01, a.currentTime + dur);
                o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur); } catch (e) {}
        }
        function playSuccessArpeggio() {
            try { const a = getAudio(), now = a.currentTime;
                [261.63, 329.63, 392.00, 523.25].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f, now + i * 0.08);
                    g.gain.setValueAtTime(0.15, now + i * 0.08); g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.25); o.connect(g); g.connect(a.destination); o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.25); });
            } catch (e) {}
        }
        const playFailBuzz = () => playTone(110, 'sawtooth', 0.35);

        const SVG_MELODY = MASCOTS.html('melody', 'w-16 h-16 drop-shadow-md');

        // ---- the questions ---------------------------------------------
        // Stage 1: the note is written on the stave, tap Middle C on the keys.
        // Stage 2: a note on the stave, is it Middle C? (yes/no)
        // Stage 3: a key is lit on the keyboard, is it Middle C? (yes/no)
        const MIDDLE_ROUNDS = [{ id: 'C4', clef: 'T' }, { id: 'C4', clef: 'B' }];
        const OTHER_ROUNDS = [
            { id: 'D4', clef: 'T' }, { id: 'E4', clef: 'T' }, { id: 'B3', clef: 'B' }, { id: 'A3', clef: 'B' },
            { id: 'C5', clef: 'T' }, { id: 'C3', clef: 'B' }, { id: 'G3', clef: 'B' }, { id: 'F4', clef: 'T' }
        ];
        const OTHER_KEYS = ['B3', 'D4', 'C3', 'C5', 'E4', 'A3', 'G3', 'F4'];
        const pick = a => a[Math.floor(Math.random() * a.length)];
        const nameOf = id => id[0];

        function setStage(n) {
            currentStage = n;
            for (let i = 1; i <= 3; i++) $(`btn-stage-${i}`).className = 'py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 ' + (i === n ? 'bg-teal-400 text-white border-b-2 border-teal-600 shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200');
            resetStats(); newRound();
        }

        if (typeof RewardSystem !== 'undefined') RewardSystem.onAnimalComplete(() => { triggerStageComplete(); });

        function newRound() {
            clearTimeout(roundTimer); controlLock = false;
            const wantMiddle = currentStage === 1 ? true : Math.random() < 0.5;
            let r, tries = 0;
            do {
                if (currentStage === 3) r = { id: wantMiddle ? MIDDLE : pick(OTHER_KEYS) };
                else r = Object.assign({}, wantMiddle ? pick(MIDDLE_ROUNDS) : pick(OTHER_ROUNDS));
            } while (++tries < 8 && (r.id + (r.clef || '')) === lastKey);
            lastKey = r.id + (r.clef || ''); round = r;

            const btns = $('answer-buttons'); btns.innerHTML = '';
            const fb = $('feedback'); fb.className = 'text-center text-base font-bold min-h-[24px] text-slate-700 mb-2'; fb.innerHTML = '&nbsp;';
            if (currentStage === 1) {
                drawStaff({ id: MIDDLE, clef: r.clef }); renderPiano(null, null);
                $('question-text').innerText = 'Tap Middle C on the keyboard!';
                $('mascot-dialog').innerText = r.clef === 'T' ? "This note is Middle C, just below the treble stave. Find its key!" : "This note is Middle C, just above the bass stave. Find its key!";
            } else {
                if (currentStage === 2) { drawStaff(r); renderPiano(null, null); $('question-text').innerText = 'Is this note Middle C?'; $('mascot-dialog').innerText = 'Look at the note. Is it Middle C?'; }
                else { drawStaff(null); renderPiano(r.id, null); $('question-text').innerText = 'Is this key Middle C?'; $('mascot-dialog').innerText = 'Look at the lit key. Is it Middle C?'; }
                [['Yes', true, 'from-green-500 to-green-600 border-green-800'], ['No', false, 'from-rose-500 to-rose-600 border-rose-800']].forEach(([t, v, cls]) => {
                    const b = document.createElement('button'); b.innerText = t;
                    b.className = `bg-gradient-to-b ${cls} text-white font-black text-2xl w-28 h-14 rounded-2xl border-b-4 active:translate-y-0.5 active:border-b-2 transition-all shadow-md`;
                    b.onclick = () => answerYesNo(v); btns.appendChild(b);
                });
            }
        }

        function pressKey(id, el) {
            if (controlLock || currentStage !== 1) return;
            playTone(freqOf(id), 'triangle', 0.6);
            if (id === MIDDLE) { renderPiano(null, MIDDLE); right('You found Middle C!'); }
            else {
                const msg = id[0] === 'C' ? "That's a C, but not the middle one. Middle C is in the middle of the keyboard!" : `That's ${nameOf(id)}. Middle C is just left of the two black keys, in the middle!`;
                wrong(msg, el);
            }
        }
        function answerYesNo(v) {
            if (controlLock) return;
            const isMiddle = round.id === MIDDLE;
            if (v === isMiddle) { playTone(freqOf(round.id), 'triangle', 0.6); right(isMiddle ? "Yes! That's Middle C!" : `Correct! That's not Middle C. It's ${nameOf(round.id)}.`); }
            else wrong(isMiddle ? "It is Middle C! Written just below the treble stave or just above the bass stave." : `That's ${nameOf(round.id)}, not Middle C.`);
        }

        function right(msg) {
            score += 10; streak++;
            Tracking.logAnswer({ correct: true, stage: currentStage });
            RewardSystem.correct();
            $('score').innerText = score; $('streak').innerText = streak;
            const fb = $('feedback'); fb.className = 'text-center text-base font-bold min-h-[24px] text-green-600 mb-2'; fb.innerText = `⭐ ${msg} ⭐`;
            $('mascot-dialog').innerText = msg;
            triggerConfetti();
            const av = $('mascot-avatar'); av.className = 'mascot-spin shrink-0'; setTimeout(() => { av.className = 'mascot-bounce shrink-0'; }, 600);
            controlLock = true; roundTimer = setTimeout(newRound, 1900);
        }
        function wrong(msg, el) {
            streak = 0; lives--;
            Tracking.logAnswer({ correct: false, stage: currentStage });
            $('streak').innerText = streak; updateHearts();
            if (el) { el.classList.add('wrong-flash'); setTimeout(() => el.classList.remove('wrong-flash'), 400); }
            const fb = $('feedback'); fb.className = 'text-center text-base font-bold min-h-[24px] text-rose-500 mb-2'; fb.innerText = 'Not quite!';
            $('mascot-dialog').innerText = msg;
            playFailBuzz();
            if (lives <= 0) { controlLock = true; setTimeout(triggerGameOver, 900); }
        }

        function triggerConfetti() {
            const holder = $('confetti-holder'), colors = ['#f43f5e', '#3b82f6', '#10b981', '#eab308', '#a855f7', '#ff7849'];
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div'); p.className = 'confetti';
                const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 120;
                p.style.setProperty('--dx', `${Math.cos(a) * d}px`); p.style.setProperty('--dy', `${Math.sin(a) * d}px`);
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)]; p.style.left = '50%'; p.style.top = '50%';
                holder.appendChild(p); setTimeout(() => p.remove(), 1000);
            }
        }
        function updateHearts() { let h = ''; for (let i = 0; i < 3; i++) h += i < lives ? '❤️' : '🖤'; $('hearts-container').innerHTML = h; }

        function triggerStageComplete() {
            GameProgress.stageCleared(currentStage);
            playSuccessArpeggio();
            $('overlay-mascot').innerHTML = SVG_MELODY;
            $('overlay-title').innerText = '🌟 Sensational! 🌟';
            const m = $('overlay-msg'), b = $('overlay-btn');
            if (currentStage < 3) { m.innerText = `You completed Stage ${currentStage}! Ready for Stage ${currentStage + 1}?`; b.innerText = 'Go to Next Stage!'; b.onclick = () => { dismissOverlay(); setStage(currentStage + 1); }; }
            else { m.innerText = 'Incredible! You know Middle C on the stave and on the keys!'; b.innerText = 'Back to Arcade!'; b.onclick = () => { dismissOverlay(); location.href = (window.ARCADE_URL || 'music_arcade.html'); }; }
            $('overlay').classList.remove('hidden');
        }
        function triggerGameOver() {
            $('overlay-mascot').innerHTML = SVG_MELODY;
            $('overlay-title').innerText = 'No More Hearts!';
            $('overlay-msg').innerText = "Let's look at Middle C again and try this stage once more!";
            const b = $('overlay-btn'); b.innerText = 'Restart Stage'; b.onclick = () => { dismissOverlay(); resetStats(); newRound(); };
            $('overlay').classList.remove('hidden');
        }
        function dismissOverlay() { $('overlay').classList.add('hidden'); controlLock = false; }
        function resetStats() { streak = 0; lives = 3; $('streak').innerText = streak; updateHearts(); }
        function resetGame() { score = 0; $('score').innerText = score; setStage(1); }
        function toggleHints() {
            hintsEnabled = !hintsEnabled; $('hint-btn-text').innerText = hintsEnabled ? 'Turn Hints Off' : 'Turn Hints On';
            if (round) { if (currentStage === 2) drawStaff(round); else if (currentStage === 1) { drawStaff({ id: MIDDLE, clef: round.clef }); renderPiano(null, null); } }
        }
        window.addEventListener('resize', () => { if (round && !controlLock) renderPiano(currentStage === 3 ? round.id : null, null); });

        const VIDEO_URL = '';
        document.addEventListener('DOMContentLoaded', async () => {
            $('mascot-avatar').innerHTML = SVG_MELODY;
            if (VIDEO_URL) { const a = document.createElement('a'); a.href = VIDEO_URL; a.target = '_blank'; a.rel = 'noopener'; a.className = 'block text-center text-xs font-bold text-orange-600 underline mt-2'; a.innerText = '▶ Watch the video: Middle C'; $('game-card').appendChild(a); }
            try { const f = new FontFace('Noto Music', 'url(fonts/noto-music.woff2)'); document.fonts.add(f); await f.load(); } catch (e) { console.warn('Noto Music failed to load'); }
            setStage(1);
        });
    </script>
</body>
</html>

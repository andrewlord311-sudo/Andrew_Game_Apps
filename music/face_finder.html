<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle, #bfdbfe 0%, #fbcfe8 100%);
            min-height: 100vh;
        }
        .kids-title { font-family: 'Fredoka One', cursive; }
        .mascot-bounce { animation: idle-bounce 2s ease-in-out infinite alternate; }
        @keyframes idle-bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
        .mascot-spin { animation: happy-spin 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1; }
        @keyframes happy-spin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.3); } 100% { transform: rotate(360deg) scale(1); } }
        .mascot-sad { animation: sad-shake 0.5s ease-in-out 1; }
        @keyframes sad-shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px) rotate(-5deg); } 40%, 80% { transform: translateX(10px) rotate(5deg); } }
        .confetti { position: absolute; pointer-events: none; width: 12px; height: 12px; border-radius: 50%; animation: blow-up 1s ease-out forwards; }
        @keyframes blow-up { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
        .white-key {
            box-shadow: inset 0 -8px 0 #e2e8f0, 0 4px 6px rgba(0,0,0,0.05);
            transition: background-color 0.1s, transform 0.05s, box-shadow 0.05s;
        }
        .white-key:active, .white-key.active-press {
            background-color: #f1f5f9;
            box-shadow: inset 0 -2px 0 #cbd5e1, 0 1px 3px rgba(0,0,0,0.05);
            transform: translateY(4px);
        }
        .black-key {
            box-shadow: inset 0 -6px 0 #000000, 0 3px 5px rgba(0,0,0,0.3);
            transition: background-color 0.1s, transform 0.05s, box-shadow 0.05s;
        }
        .black-key:active, .black-key.active-press {
            background-color: #334155;
            box-shadow: inset 0 -2px 0 #000000, 0 1px 2px rgba(0,0,0,0.3);
            transform: translateY(2px);
        }
        button { touch-action: manipulation; }
        .mnemonic-tile { transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), background-color 0.3s ease, color 0.3s ease; }
        .mnemonic-tile.pop { transform: scale(1.25); background-color: #2563eb; color: #fff; }
    </style>
</head>
<body class="py-1 px-4 flex items-center justify-center">

    <div id="game-card" class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl border-4 border-blue-400 p-3 relative overflow-hidden">

        <div class="flex justify-between items-center mb-2">
            <div class="flex gap-2">
                <span class="bg-yellow-100 text-yellow-800 px-3 py-1.5 rounded-full font-bold text-sm shadow-sm flex items-center gap-1">
                    ⭐ Score: <span id="score">0</span>
                </span>
                <span class="bg-orange-100 text-orange-800 px-3 py-1.5 rounded-full font-bold text-sm shadow-sm flex items-center gap-1">
                    🔥 Streak: <span id="streak">0</span>
                </span>
            </div>
            <div class="flex items-center gap-1 text-2xl" id="hearts-container">❤️❤️❤️</div>
        </div>

        <h1 class="kids-title text-2xl text-blue-600 text-center mb-0.5">Face Finder</h1>
        <p class="text-slate-500 text-center text-xs font-semibold mb-1.5">Find F-A-C-E on the keyboard — the same notes as Space Face!</p>

        <div class="grid grid-cols-2 gap-2 bg-blue-50 p-1.5 rounded-2xl mb-1.5 border border-blue-100" id="stage-buttons">
            <button id="btn-stage-1" onclick="setStage(1)" class="py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 bg-blue-400 text-white border-b-2 border-blue-600 shadow">
                ☀️ Stage 1: The Spaces
            </button>
            <button id="btn-stage-2" onclick="setStage(2)" class="py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200">
                🌟 Stage 2: The Lines
            </button>
        </div>

        <div class="flex items-center gap-3 bg-blue-50 p-1.5 rounded-2xl border border-blue-100 mb-1.5">
            <div id="mascot-avatar" class="mascot-bounce shrink-0"></div>
            <div class="relative bg-white border border-blue-100 p-2 rounded-xl shadow-sm w-full">
                <div class="absolute top-1/2 -left-2 w-4 h-4 -translate-y-1/2 rotate-45 bg-white border-l border-b border-blue-50"></div>
                <p id="mascot-dialog" class="text-slate-700 font-bold text-sm leading-snug">
                    Hi, I'm Melody! Press the piano key that matches the note on the stave!
                </p>
            </div>
        </div>

        <div class="relative bg-slate-50 rounded-2xl p-2 border-2 border-slate-200 mb-1.5 flex justify-center items-center">
            <canvas id="canvas" width="300" height="180" class="max-h-32 w-auto rounded-xl bg-white shadow-inner"></canvas>
            <div id="confetti-holder" class="absolute inset-0 pointer-events-none overflow-hidden rounded-2xl"></div>

            <div id="overlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm rounded-2xl flex flex-col justify-center items-center p-6 text-center hidden transition-opacity duration-300 z-50">
                <div id="overlay-mascot" class="mb-3 mascot-bounce"></div>
                <h3 id="overlay-title" class="kids-title text-3xl text-blue-600 mb-2">Stage Passed!</h3>
                <p id="overlay-msg" class="text-slate-600 font-bold mb-4">Incredible job!</p>
                <button id="overlay-btn" onclick="dismissOverlay()" class="bg-yellow-400 text-slate-800 font-extrabold px-8 py-3 rounded-full border-b-4 border-yellow-600 hover:brightness-105 active:scale-95 transition-all text-lg">
                    Next Challenge!
                </button>
            </div>
        </div>

        <div id="mnemonic-strip" class="flex justify-center gap-2 mb-1.5"></div>

        <div id="feedback" class="text-center text-base font-bold min-h-[22px] text-slate-700 mb-1.5">
            Press the correct piano key below!
        </div>

        <div class="mb-1.5">
            <div class="bg-slate-100 p-1 rounded-t-2xl border-t-2 border-x-2 border-slate-200 text-xs font-bold text-slate-600 text-center tracking-wide">
                Two-Octave Range from Middle C
            </div>
            <div id="piano-container" class="relative flex select-none bg-slate-800 p-2 rounded-b-2xl border-x-2 border-b-4 border-slate-300 h-28 w-full overflow-hidden">
                <!-- injected -->
            </div>
        </div>

        <div class="flex justify-between items-center text-xs">
            <button onclick="toggleHints()" class="bg-purple-100 text-purple-700 border-b-2 border-purple-300 font-bold px-4 py-2 rounded-xl hover:bg-purple-200">
                💡 <span id="hint-btn-text">Turn Hints On</span>
            </button>
            <button onclick="resetGame()" class="bg-rose-100 text-rose-700 border-b-2 border-rose-300 font-bold px-4 py-2 rounded-xl hover:bg-rose-200">
                🔄 Reset Score
            </button>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script src="back-link.js"></script>
    <script src="reward-system.js"></script>
    <script>window.GP_TOTAL_STAGES = 2;</script> <!-- this game has 2 stages: spaces, then lines -->
    <script src="game-progress.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let currentStage = 1;
        let score = 0;
        let streak = 0;
        let lives = 3;
        let hintsEnabled = false;
        let controlLock = false;
        let currentNoteId = null;

        // Keyboard is permanently fixed to C4 - C6 (two octaves from Middle C),
        // comfortably covering every note in both stages below.
        const START_OCTAVE = 4;

        // Stage 1: the treble clef's four spaces, bottom to top, spell F-A-C-E -
        // the exact same notes taught by Space Face, now found on the keyboard.
        const SPACE_NOTES = {
            F4: { letter: 'F', lineStep: 1 },
            A4: { letter: 'A', lineStep: 3 },
            C5: { letter: 'C', lineStep: 5 },
            E5: { letter: 'E', lineStep: 7 },
        };
        // Stage 2: the five lines around those spaces spell E-G-B-D-F.
        const LINE_NOTES = {
            E4: { letter: 'E', lineStep: 0 },
            G4: { letter: 'G', lineStep: 2 },
            B4: { letter: 'B', lineStep: 4 },
            D5: { letter: 'D', lineStep: 6 },
            F5: { letter: 'F', lineStep: 8 },
        };
        const STAGE_WORDS = { 1: 'FACE', 2: 'EGBDF' };

        function currentDatabase() { return currentStage === 1 ? SPACE_NOTES : LINE_NOTES; }
        function currentLetters() { return STAGE_WORDS[currentStage].split(''); }

        const dialogs = {
            stage1: "Find F, A, C and E on the keyboard — the treble clef's spaces!",
            stage2: "Now find the lines around them — E, G, B, D and F.",
            correct: "Perfect key! You found it! 🎹",
            incorrect: "Almost! Check the stave and count again.",
        };

        const SVG_MELODY = `
        <svg viewBox="0 0 100 100" class="w-16 h-16 drop-shadow-md">
            <circle cx="50" cy="50" r="35" fill="#2dd4bf" />
            <path d="M 15,50 A 35,35 0 0,0 50,85 Z" fill="#0d9488" />
            <ellipse cx="40" cy="62" rx="15" ry="12" fill="#ccfbf1" />
            <circle cx="65" cy="40" r="7" fill="#ffffff" />
            <circle cx="67" cy="40" r="3.5" fill="#0f172a" />
            <circle cx="69" cy="38" r="1.5" fill="#ffffff" />
            <polygon points="75,45 90,48 78,55" fill="#fb923c" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M 25,50 C 20,40 35,35 45,50 C 40,60 30,60 25,50 Z" fill="#14b8a6" />
            <path d="M 40,18 Q 30,8 42,12 Q 54,8 44,18" fill="#2dd4bf" />
        </svg>`;

        // Chromatic frequencies across the fixed C4-C6 keyboard, so both
        // correct and mistaken key presses play a real pitch.
        const noteFreqs = {
            "C4": 261.63, "C#4": 277.18, "D4": 293.66, "D#4": 311.13, "E4": 329.63, "F4": 349.23, "F#4": 369.99, "G4": 392.00, "G#4": 415.30, "A4": 440.00, "A#4": 466.16, "B4": 493.88,
            "C5": 523.25, "C#5": 554.37, "D5": 587.33, "D#5": 622.25, "E5": 659.25, "F5": 698.46, "F#5": 739.99, "G5": 783.99, "G#5": 830.61, "A5": 880.00, "A#5": 932.33, "B5": 987.77,
            "C6": 1046.50
        };

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playTone(freq, type = 'triangle', duration = 0.5) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }
        function playSuccessArpeggio() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.25);
                });
            } catch (e) {}
        }
        function playFailBuzz() { playTone(110, 'sawtooth', 0.35); }

        function setStage(stageNum) {
            currentStage = stageNum;
            for (let i = 1; i <= 2; i++) {
                const btn = document.getElementById(`btn-stage-${i}`);
                btn.className = i === stageNum
                    ? "py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 bg-blue-400 text-white border-b-2 border-blue-600 shadow"
                    : "py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200";
            }
            document.getElementById('mascot-dialog').innerText = dialogs[`stage${stageNum}`];
            resetStats();
            renderMnemonicStrip();
            newRound();
        }

        // Completing an animal (8 correct answers, see reward-system.js) is
        // what actually completes a stage here - not the streak counter,
        // which is just a fun "in a row" display.
        if (typeof RewardSystem !== 'undefined') {
            RewardSystem.onAnimalComplete(() => { triggerStageComplete(); });
        }

        function renderMnemonicStrip() {
            const strip = document.getElementById('mnemonic-strip');
            strip.innerHTML = '';
            currentLetters().forEach(letter => {
                const tile = document.createElement('div');
                tile.className = "mnemonic-tile bg-blue-100 text-blue-700 font-black text-lg w-9 h-9 rounded-xl flex items-center justify-center";
                tile.dataset.letter = letter;
                tile.innerText = letter;
                strip.appendChild(tile);
            });
        }

        function popMnemonicTile(letter) {
            const strip = document.getElementById('mnemonic-strip');
            strip.querySelectorAll(`[data-letter="${letter}"]`).forEach(tile => {
                tile.classList.add('pop');
                setTimeout(() => tile.classList.remove('pop'), 500);
            });
        }

        // Draw the 5-line staff, treble clef, and a hollow note head - every
        // note in this game sits inside the staff, so no ledger lines needed.
        function drawStaff() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const startY = 50;
            const lineGap = 16;
            const width = 220;
            const startX = 40;

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2.5;
            for (let i = 0; i < 5; i++) {
                const y = startY + i * lineGap;
                ctx.beginPath();
                ctx.moveTo(startX, y);
                ctx.lineTo(startX + width, y);
                ctx.stroke();
            }

            ctx.textBaseline = 'alphabetic';
            ctx.textAlign = 'left';
            ctx.fillStyle = '#1e293b';
            ctx.font = `${lineGap * 4}px "Noto Music", serif`;
            ctx.fillText("\u{1D11E}", startX + 6, startY + 4 * lineGap);

            const db = currentDatabase();
            const note = db[currentNoteId];
            const noteX = canvas.width / 2 + 40;
            const noteY = startY + (8 - note.lineStep) * (lineGap / 2);

            ctx.save();
            ctx.translate(noteX, noteY);
            ctx.rotate(-0.25);
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            ctx.ellipse(0, 0, 11, 7.5, 0, 0, 2 * Math.PI);
            ctx.stroke();
            ctx.restore();

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            if (note.lineStep >= 4) {
                ctx.moveTo(noteX - 11, noteY);
                ctx.lineTo(noteX - 11, noteY + 45);
            } else {
                ctx.moveTo(noteX + 11, noteY);
                ctx.lineTo(noteX + 11, noteY - 45);
            }
            ctx.stroke();
        }

        function newRound() {
            const db = currentDatabase();
            const keys = Object.keys(db);
            let pickedKey;
            do {
                pickedKey = keys[Math.floor(Math.random() * keys.length)];
            } while (keys.length > 1 && pickedKey === currentNoteId);
            currentNoteId = pickedKey;
            controlLock = false;

            drawStaff();
            renderPiano();

            const feedback = document.getElementById('feedback');
            feedback.className = "text-center text-base font-bold text-slate-700 mb-1.5";
            feedback.innerText = "Press the correct piano key below!";
        }

        // Programmatic piano builder, fixed to two octaves from C4.
        function renderPiano() {
            const container = document.getElementById('piano-container');
            container.innerHTML = '';

            const whiteNotes = ['C', 'D', 'E', 'F', 'G', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'A', 'B', 'C'];
            const keysData = [];

            for (let i = 0; i < 15; i++) {
                const noteName = whiteNotes[i];
                const octaveOffset = Math.floor(i / 7);
                const currentOct = START_OCTAVE + octaveOffset;
                keysData.push({ id: `${noteName}${currentOct}`, name: noteName, octave: currentOct });
            }

            keysData.forEach((key) => {
                const keyDiv = document.createElement('div');
                const isMiddleC = (key.id === "C4");

                keyDiv.className = "white-key flex-1 min-w-0 bg-white border-r-2 border-slate-200 rounded-b-xl flex flex-col justify-end items-center pb-3 text-xs font-black text-slate-500 cursor-pointer h-full relative select-none";
                keyDiv.dataset.note = key.id;

                if (isMiddleC) {
                    const label = document.createElement('span');
                    label.innerText = "Middle C";
                    label.className = "absolute bottom-2 left-1/2 -translate-x-1/2 -rotate-90 origin-center text-[9px] text-blue-600 font-extrabold uppercase bg-blue-50 px-1 py-0.5 rounded border border-blue-200 text-center leading-none whitespace-nowrap z-10";
                    keyDiv.appendChild(label);
                }

                if (hintsEnabled && key.id === currentNoteId) {
                    const hintDot = document.createElement('div');
                    hintDot.className = "absolute top-4 w-3.5 h-3.5 rounded-full bg-purple-500 animate-ping";
                    keyDiv.appendChild(hintDot);
                }

                keyDiv.addEventListener('mousedown', () => handleKeyInteraction(key.id, keyDiv));
                container.appendChild(keyDiv);
            });

            const blackOffsets = [
                { afterIndex: 0, name: "C#" }, { afterIndex: 1, name: "D#" }, { afterIndex: 3, name: "F#" },
                { afterIndex: 4, name: "G#" }, { afterIndex: 5, name: "A#" }, { afterIndex: 7, name: "C#" },
                { afterIndex: 8, name: "D#" }, { afterIndex: 10, name: "F#" }, { afterIndex: 11, name: "G#" },
                { afterIndex: 12, name: "A#" }
            ];

            const containerWidth = container.clientWidth - 16;
            const whiteKeyWidth = containerWidth / 15;

            blackOffsets.forEach((bo) => {
                const octaveOffset = Math.floor(bo.afterIndex / 7);
                const currentOct = START_OCTAVE + octaveOffset;
                const noteID = `${bo.name}${currentOct}`;

                const blackDiv = document.createElement('div');
                blackDiv.className = "black-key absolute bg-slate-950 rounded-b-lg cursor-pointer h-14 z-30 select-none";
                blackDiv.style.width = `${whiteKeyWidth * 0.65}px`;
                const leftPos = (bo.afterIndex + 1) * whiteKeyWidth + 8 - (whiteKeyWidth * 0.65 / 2);
                blackDiv.style.left = `${leftPos}px`;
                blackDiv.dataset.note = noteID;

                blackDiv.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    handleKeyInteraction(noteID, blackDiv);
                });

                container.appendChild(blackDiv);
            });
        }

        function handleKeyInteraction(noteID, keyElement) {
            if (controlLock) return;

            keyElement.classList.add('active-press');
            setTimeout(() => keyElement.classList.remove('active-press'), 150);

            if (noteID === currentNoteId) {
                score += 10;
                streak++;
                const note = currentDatabase()[currentNoteId];
                Tracking.logAnswer({ correct: true, stage: currentStage });
                RewardSystem.correct();
                document.getElementById('score').innerText = score;
                document.getElementById('streak').innerText = streak;

                const feedback = document.getElementById('feedback');
                feedback.className = "text-center text-lg font-bold text-green-600 mb-1.5";
                feedback.innerText = `⭐ Beautiful! That is ${noteID}! ⭐`;

                if (noteFreqs[noteID]) playTone(noteFreqs[noteID], 'triangle', 0.6);
                triggerConfetti();
                popMnemonicTile(note.letter);
                document.getElementById('mascot-dialog').innerText = dialogs.correct;

                const avatar = document.getElementById('mascot-avatar');
                avatar.className = "mascot-spin shrink-0";
                controlLock = true;
                setTimeout(() => { avatar.className = "mascot-bounce shrink-0"; }, 600);

                setTimeout(newRound, 1300);
            } else {
                streak = 0;
                lives--;
                Tracking.logAnswer({ correct: false, stage: currentStage });
                document.getElementById('streak').innerText = streak;
                updateHearts();

                const feedback = document.getElementById('feedback');
                feedback.className = "text-center text-base font-bold text-rose-500 mb-1.5";
                feedback.innerText = "Close! Let's listen and try another key!";

                if (noteFreqs[noteID]) playTone(noteFreqs[noteID], 'sine', 0.35);
                setTimeout(playFailBuzz, 250);

                document.getElementById('mascot-dialog').innerText = dialogs.incorrect;
                const avatar = document.getElementById('mascot-avatar');
                avatar.className = "mascot-sad shrink-0";

                controlLock = true;
                setTimeout(() => {
                    avatar.className = "mascot-bounce shrink-0";
                    controlLock = false;
                }, 600);

                if (lives <= 0) {
                    setTimeout(triggerGameOver, 1000);
                }
            }
        }

        function triggerConfetti() {
            const holder = document.getElementById('confetti-holder');
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#eab308', '#a855f7', '#ff7849'];
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.className = 'confetti';
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 120;
                particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = '50%';
                particle.style.top = '50%';
                holder.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }
        }

        function updateHearts() {
            const container = document.getElementById('hearts-container');
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) container.innerHTML += i < lives ? '❤️' : '🖤';
        }

        function triggerStageComplete() {
            GameProgress.stageCleared(currentStage, 2);
            playSuccessArpeggio();
            const overlay = document.getElementById('overlay');
            document.getElementById('overlay-mascot').innerHTML = SVG_MELODY;
            document.getElementById('overlay-title').innerText = "🌟 Sensational! 🌟";
            const oMsg = document.getElementById('overlay-msg');
            const oBtn = document.getElementById('overlay-btn');

            if (currentStage < 2) {
                oMsg.innerText = `You found every space note — F, A, C, E! Ready for the lines?`;
                oBtn.innerText = "Go to Stage 2!";
                oBtn.onclick = () => { dismissOverlay(); setStage(2); };
            } else {
                oMsg.innerText = `Outstanding! You can find every treble space and line on the keyboard!`;
                oBtn.innerText = "Back to Arcade!";
                oBtn.onclick = () => { dismissOverlay(); location.href = "music_arcade.html"; };
            }
            overlay.classList.remove('hidden');
        }

        function triggerGameOver() {
            const overlay = document.getElementById('overlay');
            document.getElementById('overlay-mascot').innerHTML = SVG_MELODY;
            document.getElementById('overlay-title').innerText = "No More Hearts!";
            document.getElementById('overlay-msg').innerText = "Let's replenish your hearts and retry this stage together!";
            const oBtn = document.getElementById('overlay-btn');
            oBtn.innerText = "Restart Stage";
            oBtn.onclick = () => { dismissOverlay(); resetStats(); newRound(); };
            overlay.classList.remove('hidden');
        }

        function dismissOverlay() { document.getElementById('overlay').classList.add('hidden'); }

        function resetStats() {
            streak = 0;
            lives = 3;
            document.getElementById('streak').innerText = streak;
            updateHearts();
        }

        function resetGame() {
            score = 0;
            document.getElementById('score').innerText = score;
            setStage(1);
        }

        function toggleHints() {
            hintsEnabled = !hintsEnabled;
            document.getElementById('hint-btn-text').innerText = hintsEnabled ? "Turn Hints Off" : "Turn Hints On";
            renderPiano();
        }

        window.addEventListener('resize', () => { renderPiano(); });

        window.onload = async () => {
            document.getElementById('mascot-avatar').innerHTML = SVG_MELODY;
            try {
                const notoMusicFont = new FontFace(
                    'Noto Music',
                    'url(https://fonts.gstatic.com/s/notomusic/v21/pe0rMIiSN5pO63htf1sxEkW7I9tAcVwob5A.woff2)'
                );
                document.fonts.add(notoMusicFont);
                await notoMusicFont.load();
            } catch (e) {
                console.warn('Noto Music font failed to load; clef will use fallback serif glyph.', e);
            }
            setStage(1);
        };
    </script>
</body>
</html>

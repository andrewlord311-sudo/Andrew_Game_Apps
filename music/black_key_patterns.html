<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Key Patterns</title>
    <link rel="preload" href="fonts/fredoka-one.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/quicksand.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="tailwind.css">
    <style>

        body {
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle, #cffafe 0%, #e0e7ff 100%);
            min-height: 100vh;
        }
        .kids-title {
            font-family: 'Fredoka One', cursive;
        }
        .mascot-bounce { animation: idle-bounce 2s ease-in-out infinite alternate; }
        @keyframes idle-bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
        .mascot-spin { animation: happy-spin 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1; }
        @keyframes happy-spin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.3); } 100% { transform: rotate(360deg) scale(1); } }
        .mascot-sad { animation: sad-shake 0.5s ease-in-out 1; }
        @keyframes sad-shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px) rotate(-5deg); } 40%, 80% { transform: translateX(10px) rotate(5deg); } }
        .confetti { position: absolute; pointer-events: none; width: 12px; height: 12px; border-radius: 50%; animation: blow-up 1s ease-out forwards; }
        @keyframes blow-up { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }

        .white-key {
            box-shadow: inset 0 -8px 0 #e2e8f0, 0 4px 6px rgba(0,0,0,0.05);
            transition: background-color 0.1s, transform 0.05s, box-shadow 0.05s;
        }
        .white-key.correct-flash { background-color: #86efac !important; }
        .white-key.wrong-flash { background-color: #fca5a5 !important; }
        .black-key {
            box-shadow: inset 0 -6px 0 #000000, 0 3px 5px rgba(0,0,0,0.3);
            transition: background-color 0.1s, transform 0.05s, box-shadow 0.05s;
        }
        /* a slow, smooth pulse between the key's own colour and orange (matches the video) */
        @keyframes keypulse { 0% { background-color: #0f172a; } 100% { background-color: #f59e0b; } }
        .black-key.highlight {
            animation: keypulse 1.4s ease-in-out infinite alternate;
            box-shadow: inset 0 -6px 0 rgba(0,0,0,.35), 0 0 0 3px #fbbf24;
        }
        .black-key.g2 { background-color: #0d9488 !important; box-shadow: inset 0 -6px 0 #115e59, 0 0 0 3px #99f6e4; }
        .black-key.g3 { background-color: #db2777 !important; box-shadow: inset 0 -6px 0 #9d174d, 0 0 0 3px #fbcfe8; }
        .black-key.wrong-flash { background-color: #ef4444 !important; }
        .key-badge { position: absolute; left: 50%; bottom: -30px; transform: translateX(-50%); width: 24px; height: 24px; border-radius: 9999px; color: #fff; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 rgba(0,0,0,.25); pointer-events: none; }
        .key-badge.g2 { background: #0d9488; } .key-badge.g3 { background: #db2777; }
        @media (prefers-reduced-motion: reduce) { .black-key.highlight { animation: none; background-color: #f59e0b !important; } }
        button { touch-action: manipulation; }
    </style>
</head>
<body class="py-2 px-4 flex items-center justify-center">

    <div id="game-card" class="max-w-xl w-full bg-white rounded-3xl shadow-2xl border-4 border-cyan-400 p-4 relative overflow-hidden">

        <div class="flex justify-between items-center mb-2">
            <div class="flex gap-2">
                <span class="bg-yellow-100 text-yellow-800 px-3 py-1.5 rounded-full font-bold text-sm shadow-sm flex items-center gap-1">
                    ⭐ Score: <span id="score">0</span>
                </span>
                <span class="bg-orange-100 text-orange-800 px-3 py-1.5 rounded-full font-bold text-sm shadow-sm flex items-center gap-1">
                    🔥 Streak: <span id="streak">0</span>
                </span>
            </div>
            <div class="flex items-center gap-1 text-2xl" id="hearts-container">❤️❤️❤️</div>
        </div>

        <h1 class="kids-title text-3xl text-cyan-600 text-center mb-1">Black Key Patterns</h1>
        <p class="text-slate-500 text-center text-sm font-semibold mb-3">Two, then three, two, then three: that's the pattern!</p>

        <div class="grid grid-cols-2 gap-2 bg-cyan-50 p-2 rounded-2xl mb-2 border border-cyan-100">
            <button id="btn-stage-1" onclick="setStage(1)" class="py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 bg-cyan-400 text-white border-b-2 border-cyan-600 shadow">
                ☀️ Stage 1: Two or three?
            </button>
            <button id="btn-stage-2" onclick="setStage(2)" class="py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200">
                🌴 Stage 2: Find the groups
            </button>
        </div>

        <div class="flex items-center gap-3 bg-cyan-50 p-2 rounded-2xl border border-cyan-100 mb-2">
            <div id="mascot-avatar" class="mascot-bounce shrink-0 transition-transform"></div>
            <div class="relative bg-white border border-cyan-100 p-2 rounded-xl shadow-sm w-full">
                <div class="absolute top-1/2 -left-2 w-4 h-4 -translate-y-1/2 rotate-45 bg-white border-l border-b border-cyan-50"></div>
                <p id="mascot-dialog" class="text-slate-700 font-bold text-sm leading-snug">
                    Hi, I'm Melody! Black keys come in groups of two and three. Can you spot them?
                </p>
            </div>
        </div>

        <div id="question-text" class="text-center text-lg font-black text-slate-800 mb-2">
            Is this a group of two, or three?
        </div>

        <div class="relative">
            <div id="piano-container" class="relative flex select-none bg-slate-800 p-2 rounded-2xl border-2 border-slate-300 h-32 w-full overflow-hidden">
            </div>
            <div id="confetti-holder" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
            <div id="overlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm rounded-2xl flex flex-col justify-center items-center p-6 text-center hidden transition-opacity duration-300 z-50">
                <div id="overlay-mascot" class="mb-3 mascot-bounce"></div>
                <h3 id="overlay-title" class="kids-title text-3xl text-cyan-600 mb-2">Stage Passed!</h3>
                <p id="overlay-msg" class="text-slate-600 font-bold mb-4">Incredible job!</p>
                <button id="overlay-btn" onclick="dismissOverlay()" class="bg-yellow-400 text-slate-800 font-extrabold px-8 py-3 rounded-full border-b-4 border-yellow-600 hover:brightness-105 active:scale-95 transition-all text-lg">
                    Next Challenge!
                </button>
            </div>
        </div>

        <div id="feedback" class="text-center text-lg font-bold min-h-[28px] text-slate-700 my-3">
            Look at the glowing black keys!
        </div>

        <div class="grid grid-cols-2 gap-3 mb-3" id="answer-buttons">
            <!-- injected per-stage -->
        </div>

        <div class="flex justify-between items-center text-xs">
            <button onclick="toggleHints()" class="bg-purple-100 text-purple-700 border-b-2 border-purple-300 font-bold px-4 py-2 rounded-xl hover:bg-purple-200">
                💡 <span id="hint-btn-text">Turn Hints On</span>
            </button>
            <button onclick="resetGame()" class="bg-rose-100 text-rose-700 border-b-2 border-rose-300 font-bold px-4 py-2 rounded-xl hover:bg-rose-200">
                🔄 Reset Score
            </button>
        </div>

    </div>
    <script src="mascots.js"></script>
    <script src="auth.js"></script>
    <script src="back-link.js"></script>
    <script src="reward-system.js"></script>
    <script>window.GP_TOTAL_STAGES = 2;</script>
    <script src="hit-counter.js"></script>
    <script src="game-progress.js"></script>
    <script>
        let currentStage = 1;
        let score = 0;
        let streak = 0;
        let lives = 3;
        let hintsEnabled = false;
        let controlLock = false;

        const START_OCTAVE = 3;
        let allKeys = [];
        function buildKeys() {
            allKeys = [];
            const whiteNotes = ['C', 'D', 'E', 'F', 'G', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'A', 'B', 'C'];
            for (let i = 0; i < 15; i++) {
                const noteName = whiteNotes[i];
                const octaveOffset = Math.floor(i / 7);
                const oct = START_OCTAVE + octaveOffset;
                allKeys.push({ id: `${noteName}${oct}`, name: noteName, octave: oct, isBlack: false, whiteIndex: i });
            }
            const blackSpec = [
                { afterName: 'C', name: 'C#' }, { afterName: 'D', name: 'D#' },
                { afterName: 'F', name: 'F#' }, { afterName: 'G', name: 'G#' }, { afterName: 'A', name: 'A#' }
            ];
            [0, 1].forEach(octaveOffset => {
                blackSpec.forEach(b => {
                    const oct = START_OCTAVE + octaveOffset;
                    allKeys.push({ id: `${b.name}${oct}`, name: b.name, octave: oct, isBlack: true, afterWhiteIndex: octaveOffset * 7 + ['C','D','E','F','G','A','B'].indexOf(b.afterName) });
                });
            });
        }

        // The four groups, in keyboard order: 2, 3, 2, 3 (the same as the video). No note names are shown to the player.
        const GROUPS = [
            { type: 2, keys: ['C#3', 'D#3'] }, { type: 3, keys: ['F#3', 'G#3', 'A#3'] },
            { type: 2, keys: ['C#4', 'D#4'] }, { type: 3, keys: ['F#4', 'G#4', 'A#4'] }
        ];
        const WORD = { 2: 'two', 3: 'three' };
        const groupOf = id => GROUPS.find(g => g.keys.includes(id));

        let currentGroup = null;      // the group being asked about
        let mode = 'identify';        // 'identify' (stage 1) | 'findGroup' (stage 2)

        const dialogs = {
            start: "Hi, I'm Melody! Black keys come in groups of two and three. Can you spot them?",
            correct: "Yes! Let's count them! 🎹",
            incorrect: "Look again, and count the keys carefully."
        };

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playTone(freq, type = 'triangle', duration = 0.5) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }
        function playSuccessArpeggio() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.25);
                });
            } catch (e) {}
        }
        function playFailBuzz() { playTone(110, 'sawtooth', 0.35); }

        const NOTE_SEMITONES = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
        function noteFrequency(noteId) {
            const match = noteId.match(/^([A-G]#?)(\d+)$/);
            if (!match) return 440;
            const [, name, octStr] = match;
            const midi = (parseInt(octStr, 10) + 1) * 12 + NOTE_SEMITONES[name];
            return 440 * Math.pow(2, (midi - 69) / 12);
        }
        // Plays the real notes behind a correct answer, one at a time and
        // quickly - so a "group of 3" answer is actually heard as 3 notes,
        // and a group in the higher octave sounds higher than the same
        // pattern shape in the lower octave.
        function playNoteSequence(noteIds) {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const gap = 0.16;
                noteIds.forEach((id, idx) => {
                    const freq = noteFrequency(id);
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * gap);
                    gain.gain.setValueAtTime(0, now + idx * gap);
                    gain.gain.linearRampToValueAtTime(0.3, now + idx * gap + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * gap + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * gap);
                    osc.stop(now + idx * gap + 0.3);
                });
            } catch (e) {}
        }

        const SVG_MELODY = MASCOTS.html('melody', 'w-16 h-16 drop-shadow-md');

        function setStage(stageNum) {
            currentStage = stageNum;
            for (let i = 1; i <= 2; i++) {
                const btn = document.getElementById(`btn-stage-${i}`);
                if (i === stageNum) {
                    btn.className = "py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 bg-cyan-400 text-white border-b-2 border-cyan-600 shadow";
                } else {
                    btn.className = "py-1.5 px-1 rounded-xl font-bold text-xs transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200";
                }
            }
            mode = stageNum === 1 ? 'identify' : 'findGroup';
            resetStats();
            newRound();
        }

        // Completing an animal (8 correct answers, see reward-system.js) is
        // what actually completes a stage here - not the streak counter,
        // which is just a fun "in a row" display.
        if (typeof RewardSystem !== 'undefined') {
            RewardSystem.onAnimalComplete(() => { triggerStageComplete(); });
        }

        function newRound() {
            controlLock = false;
            const q = document.getElementById('question-text'), fb = document.getElementById('feedback');
            if (mode === 'identify') {
                currentGroup = GROUPS[Math.floor(Math.random() * GROUPS.length)];
                q.innerText = "Is this a group of two, or three?";
                renderIdentifyButtons();
                fb.innerText = "Look at the glowing black keys!";
            } else if (mode === 'findGroup') {
                currentGroup = { type: Math.random() < 0.5 ? 2 : 3 };
                q.innerText = `Tap a group of ${WORD[currentGroup.type]}!`;
                document.getElementById('answer-buttons').innerHTML = '';
                fb.innerText = "Tap any black key in the group.";
            }
            renderPiano();
            fb.className = "text-center text-lg font-bold text-slate-700 my-3";
        }

        function renderIdentifyButtons() {
            const container = document.getElementById('answer-buttons');
            container.innerHTML = '';
            [2, 3].forEach(n => {
                const btn = document.createElement('button');
                btn.innerText = n === 2 ? 'Two' : 'Three';
                btn.className = "bg-gradient-to-b from-cyan-400 to-cyan-500 hover:from-cyan-500 hover:to-cyan-600 text-white font-black text-lg py-5 rounded-2xl border-b-4 border-cyan-700 active:translate-y-0.5 active:border-b-2 transition-all shadow-md";
                btn.onclick = () => makeGuess(n);
                container.appendChild(btn);
            });
            if (hintsEnabled) {
                const hint = document.createElement('div');
                hint.className = "col-span-2 text-center text-xs font-bold text-purple-600 bg-purple-50 rounded-xl py-1 mt-1";
                hint.innerText = `Answer: ${WORD[currentGroup.type]}`;
                container.appendChild(hint);
            }
        }

        function renderPiano() {
            const container = document.getElementById('piano-container');
            container.innerHTML = '';
            const whiteKeys = allKeys.filter(k => !k.isBlack);

            whiteKeys.forEach((key) => {
                const keyDiv = document.createElement('div');
                keyDiv.className = 'white-key flex-1 min-w-0 bg-white border-r-2 border-slate-200 rounded-b-xl h-full relative select-none';
                keyDiv.dataset.note = key.id;
                container.appendChild(keyDiv);
            });

            const containerWidth = container.clientWidth - 16;
            const whiteKeyWidth = containerWidth / whiteKeys.length;

            allKeys.filter(k => k.isBlack).forEach((key) => {
                const blackDiv = document.createElement('div');
                const g = groupOf(key.id);
                let cls = 'bg-slate-950';
                if (mode === 'identify' && g === currentGroup) cls = 'highlight';
                if (mode === 'findGroup' && hintsEnabled && g.type === currentGroup.type) cls = 'highlight';
                blackDiv.className = `black-key absolute rounded-b-lg z-30 select-none ${cls} ${mode === 'findGroup' ? 'cursor-pointer' : ''}`;
                blackDiv.style.height = '3.5rem';
                blackDiv.style.width = `${whiteKeyWidth * 0.65}px`;
                blackDiv.style.left = `${(key.afterWhiteIndex + 1) * whiteKeyWidth + 8 - (whiteKeyWidth * 0.65 / 2)}px`;
                blackDiv.dataset.note = key.id;
                if (mode === 'findGroup') blackDiv.addEventListener('pointerdown', () => handleBlackKeyTap(key, blackDiv));
                container.appendChild(blackDiv);
            });
        }

        // Count the keys of a group one at a time: colour, number badge and note, like the video. Then carry on.
        function revealGroup(group, done) {
            const cls = group.type === 2 ? 'g2' : 'g3';
            group.keys.forEach((id, i) => setTimeout(() => {
                const el = document.querySelector(`#piano-container .black-key[data-note="${id}"]`);
                if (!el) return;
                el.classList.remove('highlight'); el.classList.add(cls);
                el.insertAdjacentHTML('beforeend', `<span class="key-badge ${cls}">${i + 1}</span>`);
                playTone(noteFrequency(id), 'triangle', 0.5);
            }, i * 650));
            setTimeout(done, group.keys.length * 650 + 900);
        }

        function handleBlackKeyTap(key, el) {
            if (controlLock) return;
            const g = groupOf(key.id);
            if (g.type === currentGroup.type) {
                currentGroup = g;
                onCorrect();
            } else {
                el.classList.add('wrong-flash');
                setTimeout(() => el.classList.remove('wrong-flash'), 400);
                onIncorrect();
            }
        }

        function makeGuess(answer) {
            if (controlLock) return;
            if (answer === currentGroup.type) {
                onCorrect();
            } else {
                onIncorrect();
            }
        }

        function onCorrect() {
            score += 10;
            streak++;
            Tracking.logAnswer({ correct: true, stage: currentStage });
            RewardSystem.correct();
            document.getElementById('score').innerText = score;
            document.getElementById('streak').innerText = streak;

            const feedback = document.getElementById('feedback');
            feedback.className = "text-center text-lg font-bold text-green-600 my-3";
            feedback.innerText = `⭐ Yes! A group of ${WORD[currentGroup.type]}! ⭐`;
            triggerConfetti();
            document.getElementById('mascot-dialog').innerText = dialogs.correct;

            const avatar = document.getElementById('mascot-avatar');
            avatar.className = "mascot-spin shrink-0";
            controlLock = true;
            setTimeout(() => { avatar.className = "mascot-bounce shrink-0"; }, 600);

            revealGroup(currentGroup, newRound);
        }

        function onIncorrect() {
            streak = 0;
            lives--;
            Tracking.logAnswer({ correct: false, stage: currentStage });
            document.getElementById('streak').innerText = streak;
            updateHearts();

            const feedback = document.getElementById('feedback');
            feedback.className = "text-center text-lg font-bold text-rose-500 my-3";
            feedback.innerText = "Close! Try again.";

            playFailBuzz();
            document.getElementById('mascot-dialog').innerText = dialogs.incorrect;

            const avatar = document.getElementById('mascot-avatar');
            avatar.className = "mascot-sad shrink-0";
            controlLock = true;
            setTimeout(() => {
                avatar.className = "mascot-bounce shrink-0";
                controlLock = false;
            }, 600);

            if (lives <= 0) {
                setTimeout(triggerGameOver, 1000);
            }
        }

        function triggerConfetti() {
            const holder = document.getElementById('confetti-holder');
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#eab308', '#a855f7', '#ff7849'];
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.className = 'confetti';
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 120;
                particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = '50%';
                particle.style.top = '50%';
                holder.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }
        }

        function updateHearts() {
            const container = document.getElementById('hearts-container');
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) container.innerHTML += i < lives ? '❤️' : '🖤';
        }

        function triggerStageComplete() {
            GameProgress.stageCleared(currentStage, 2);
            playSuccessArpeggio();
            const overlay = document.getElementById('overlay');
            document.getElementById('overlay-mascot').innerHTML = SVG_MELODY;
            document.getElementById('overlay-title').innerText = "🌟 Sensational! 🌟";
            const oMsg = document.getElementById('overlay-msg');
            const oBtn = document.getElementById('overlay-btn');

            if (currentStage < 2) {
                oMsg.innerText = `You completed Stage ${currentStage}! Ready for Stage ${currentStage + 1}?`;
                oBtn.innerText = "Go to Next Stage!";
                oBtn.onclick = () => { dismissOverlay(); setStage(currentStage + 1); };
            } else {
                oMsg.innerText = `Fantastic! Two, then three, two, then three: you know the pattern!`;
                oBtn.innerText = "Back to Arcade!";
                oBtn.onclick = () => { dismissOverlay(); location.href = (window.ARCADE_URL || "music_arcade.html"); };
            }
            overlay.classList.remove('hidden');
        }

        function triggerGameOver() {
            const overlay = document.getElementById('overlay');
            document.getElementById('overlay-mascot').innerHTML = SVG_MELODY;
            document.getElementById('overlay-title').innerText = "No More Hearts!";
            document.getElementById('overlay-msg').innerText = "Let's look at the pattern again and retry this stage!";
            const oBtn = document.getElementById('overlay-btn');
            oBtn.innerText = "Restart Stage";
            oBtn.onclick = () => { dismissOverlay(); resetStats(); newRound(); };
            overlay.classList.remove('hidden');
        }

        function dismissOverlay() { document.getElementById('overlay').classList.add('hidden'); }

        function resetStats() {
            streak = 0;
            lives = 3;
            document.getElementById('streak').innerText = streak;
            updateHearts();
        }

        function resetGame() {
            score = 0;
            document.getElementById('score').innerText = score;
            setStage(1);
        }

        function toggleHints() {
            hintsEnabled = !hintsEnabled;
            document.getElementById('hint-btn-text').innerText = hintsEnabled ? "Turn Hints Off" : "Turn Hints On";
            if (mode === 'identify') renderIdentifyButtons();
            renderPiano();
        }

        window.addEventListener('resize', () => { renderPiano(); });

        document.addEventListener('DOMContentLoaded', () => {
            buildKeys();
            document.getElementById('mascot-avatar').innerHTML = SVG_MELODY;
            setStage(1);
        });
    </script>

<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Mascots lab</title>
<style>body{margin:0;padding:16px;font-family:sans-serif;background:linear-gradient(180deg,#fef3c7,#bae6fd)}
.row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.c{width:230px;background:rgba(255,255,255,.7);border-radius:18px;padding:6px;text-align:center;font-size:12px}
.c svg{width:100%;height:220px}.sm{width:70px;height:70px;background:#fff;border-radius:12px;display:inline-block;margin:4px}.sm svg{width:100%;height:100%}</style></head><body>
<div class="row" id="a"></div><div class="row" id="b"></div><div id="sm"></div>
<script src="../music/mascots.js"></script>
<script>
const {melody,barnaby}=MASCOTS;
const spec=[['idle',{}],['wave',{mouth:.5}],['point',{mouth:.2}],['cheer',{mouth:1}],['think',{blink:1}]];
for(const [id,fn] of [['a',melody],['b',barnaby]]) for(const [pose,o] of spec) document.getElementById(id).insertAdjacentHTML('beforeend',`<div class="c">${fn({pose,...o})}<br>${pose}</div>`);
for(const fn of [melody,barnaby]) for(const m of [0,.4,.9]) document.getElementById('sm').insertAdjacentHTML('beforeend',`<div class="sm">${fn({bust:true,mouth:m})}</div>`);
window.READY=true;
</script></body></html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Nugget video engine v2</title>
<script src="../vendor/vexflow.js"></script><script src="../notation.js"></script><script src="../../music/mascots.js"></script><script src="../../design/animals.js"></script>
<style id="fonts"></style>
<style>
:root{--ink:#241f3d;--melody:#2dd4bf;--melody-deep:#0d9488;--barnaby:#6366f1;--pink:#ec4899;--orange:#ea580c;--gold:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
body{font-family:'Quicksand',sans-serif;color:var(--ink)}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(circle at 50% 38%,#fef3c7 0%,#bae6fd 100%)}
.abs{position:absolute}
.scene{position:absolute;inset:0;display:none}
#ribbon{position:absolute;left:0;right:0;top:0;height:64px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:space-between;padding:0 34px;opacity:0}
#ribbon .brand{font-family:'Fredoka One';font-size:23px}
#ribbon .ttl{font-weight:700;font-size:22px;background:#fff;border-radius:999px;padding:6px 18px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
#prog{position:absolute;left:0;bottom:0;height:5px;background:var(--orange);width:0}
#bubble{position:absolute;left:50%;top:84px;max-width:960px;background:#fff;border-radius:30px;padding:16px 30px 18px;font-weight:700;font-size:35px;line-height:1.2;text-align:center;box-shadow:0 9px 0 rgba(0,0,0,.09);opacity:0;transform-origin:50% 100%}
#bubble .who{display:inline-block;font-family:'Fredoka One';font-size:20px;color:#fff;border-radius:999px;padding:2px 14px;margin-right:12px;vertical-align:middle;position:relative;top:-3px}
#bubble:after{content:"";position:absolute;bottom:-18px;border:18px solid transparent;border-top-color:#fff;border-bottom:0}
#bubble.m:after{left:60px}#bubble.b:after{right:60px}
#caption{position:absolute;left:50%;bottom:36px;font-family:'Fredoka One';font-size:60px;letter-spacing:2px;color:#fff;padding:8px 52px;border-radius:24px;box-shadow:0 10px 0 rgba(0,0,0,.2);opacity:0;white-space:nowrap}
.host{position:absolute;width:220px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.2));transform-origin:50% 90%}
.host svg{width:100%;display:block;overflow:visible}
.big{font-family:'Fredoka One';line-height:1.05;text-align:center}
.chip{position:absolute;font-weight:700;font-size:30px;padding:6px 20px;border-radius:999px;color:#fff;white-space:nowrap;box-shadow:0 6px 0 rgba(0,0,0,.14);opacity:0}
.halo{position:absolute;border-radius:50%;opacity:0}
.card{position:absolute;width:330px;height:216px;border-radius:30px;background:rgba(255,255,255,.7);box-shadow:0 9px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 10px 12px;opacity:0}
.card .ico{height:140px;width:300px;position:relative;display:flex;align-items:center;justify-content:center}
.card .lab{font-family:'Fredoka One';font-size:40px;line-height:1}
.num{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;font-family:'Fredoka One';font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.18);opacity:0}
.slot{position:absolute;border-radius:28px;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 4px rgba(255,255,255,.7);opacity:0}
.fl{position:absolute;font-size:38px;opacity:0;color:var(--orange)}
</style></head><body>
<div id="stage">
 <div id="floaters"></div>
 <div id="scenes"></div>
 <div id="ribbon"><div class="brand">🎵 Melody &amp; Barnaby's Music Nuggets</div><div class="ttl" id="ttl"></div><div id="prog"></div></div>
 <div id="bubble"></div>
 <div id="caption"></div>
 <div class="host" id="hostM"></div><div class="host" id="hostB"></div>
</div>
<script>
// ---------------------------------------------------------------- helpers
const FPS=30, $=(s,p=document)=>p.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const easeOut=x=>1-Math.pow(1-x,3);
const easeBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const prog=(t,t0,d)=>clamp((t-t0)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
function pop(el,t,t0,d=0.45,from=0.4){const p=prog(t,t0,d);el.style.opacity=clamp(p*2.2);el.style.scale=String(lerp(from,1,easeBack(p)))}
function fade(el,t,t0,d=0.4){el.style.opacity=String(prog(t,t0,d))}
// Melody and Barnaby come from music/mascots.js (the same drawings as the games). The SVG is rebuilt only when a visible
// change happens (a new mouth opening, a blink, a pose), so 30 fps rendering stays cheap.
const hostCache={};
function setHost(el,who,pose,mouth,blink){
  const k=who+'|'+pose+'|'+mouth+'|'+blink;
  if(el.dataset.k!==k){el.dataset.k=k;el.innerHTML=MASCOTS[who]({pose,mouth,blink})}
}

// ---------------------------------------------------------------- notation with measured geometry
const STEP={c:0,d:1,e:2,f:3,g:4,a:5,b:6};
const dia=p=>{const [l,o]=p.split('/');return +o*7+STEP[l]};
const REF={treble:dia('e/4'),bass:dia('g/2')};
function makeStave(parent,o){
  const {clef='treble',notes=[],scale=3,cx=640,cy=340,showClef=true,hideStave=false,w=380,h=170}=o;
  const box=document.createElement('div');box.className='abs';
  box.style.cssText=`left:${cx-w*scale/2}px;top:0px;width:${w*scale}px;height:${h*scale}px`;
  parent.appendChild(box); // must be displayed for measuring
  renderNotation(box,{clef,notes,width:w,height:h,scale,showClef,hideStave,color:'#241f3d'});
  const br=box.getBoundingClientRect();
  const lines=[...box.querySelectorAll('.vf-stave > path')];
  const lineY=lines.map(l=>l.getBoundingClientRect().y-br.y);
  const x0=lines[0].getBoundingClientRect().x-br.x, x1=x0+lines[0].getBoundingClientRect().width;
  // move so the middle line sits at cy
  box.style.top=(cy-lineY[2])+'px';
  const top=cy-lineY[2], sp=(lineY[4]-lineY[0])/4;
  const heads=[...box.querySelectorAll('.vf-stavenote')].map((sn,i)=>{
    const r=sn.getBoundingClientRect();const x=r.x-br.x+0.49*r.width;
    const y=lineY[4]-(dia(notes[i])-REF[clef])*(sp/2);
    const ledger=[...sn.children].filter(c=>c.tagName==='path');
    return {sn,x:box.offsetLeft+x,y:top+y,ledger,
      color(c){sn.querySelectorAll('.vf-notehead text,.vf-stem path').forEach(e=>{e.style.fill=c;e.style.stroke=c})}};
  });
  const bl0=box.querySelectorAll('.vf-stavebarline');if(bl0[0])bl0[0].style.display='none';
  const clefEl=box.querySelector('.vf-clef');
  const cr=clefEl?clefEl.getBoundingClientRect():null;
  return {box,lines,lineY:lineY.map(v=>top+v),sp,x0:box.offsetLeft+x0,x1:box.offsetLeft+x1,heads,clefEl,
    clefX:cr?box.offsetLeft+cr.x-br.x+0.3*cr.width:null, barlines:[...box.querySelectorAll('.vf-stavebarline')].slice(1)};
}
function halo(parent,x,y,r,color){const d=document.createElement('div');d.className='halo';d.style.cssText=`left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;background:radial-gradient(circle,${color} 0%,rgba(255,255,255,0) 70%)`;parent.appendChild(d);return d}
function chip(parent,txt,bg,x,y,anchor='c'){const c=document.createElement('div');c.className='chip';c.textContent=txt;c.style.background=bg;parent.appendChild(c);const w=c.offsetWidth;c.style.left=(anchor==='c'?x-w/2:x)+'px';c.style.top=y+'px';return c}
function band(parent,x0,x1,y0,y1,color){const d=document.createElement('div');d.className='abs';d.style.cssText=`left:${x0}px;top:${y0}px;width:${x1-x0}px;height:${y1-y0}px;background:${color};border-radius:6px;opacity:0`;parent.appendChild(d);return d}
function setLine(el,p){el.style.transformBox='fill-box';el.style.transformOrigin='0 50%';el.style.transform=`scaleX(${p})`;el.style.opacity=p>0?1:0}
function lineWidth(el,w){el.style.strokeWidth=w}
const DOT=(c,r)=>`<span style="display:inline-block;width:${r}px;height:${r}px;border-radius:50%;background:${c}"></span>`;

// ---------------------------------------------------------------- state / UI layouts
let TL,SC=[],CL;
function wt(id,word,nth=0){const c=CL[id];const h=c.words.filter(w=>w[0].startsWith(word));return c.start+(h[nth]?h[nth][1]:0.4)}
const HOSTS={ // left/bottom/width per mascot (the full-body drawings are about 1.23x as tall as wide)
  open:{m:[70,30,215],b:[995,30,220]},
  side:{m:[22,8,165],b:[1088,8,170]},
  low:{m:[10,4,108],b:[1160,4,112]},
  bye:{m:[330,70,205],b:[745,70,210]},
};
function speakerAt(t){for(const id in CL){const c=CL[id];if(t>=c.start-0.05&&t<c.end+0.18)return {id,...c}}return null}
function level(c,t){const i=Math.floor((t-c.start)*FPS);return (c.env[i]??0)}

// ---------------------------------------------------------------- scenes
const S={}; // id -> {build(root), update(t,L,c)}   c = ctx helpers
const tint={m:'#0d9488',b:'#6366f1'};

S.opener={ui:{ribbon:0,hosts:'open',bubble:false},build(r){
  this.t1=document.createElement('div');this.t1.className='big abs';this.t1.style.cssText='left:0;right:0;top:236px;font-size:84px';this.t1.innerHTML=`<span class="w">Melody</span> <span class="w">&amp;</span> <span class="w">Barnaby's</span><br><span class="w" style="color:var(--orange);font-size:96px">Music</span> <span class="w" style="color:var(--orange);font-size:96px">Nuggets</span>`;r.appendChild(this.t1);
  this.words=[...this.t1.querySelectorAll('.w')].map(e=>{e.style.display='inline-block';return e});
  this.tag=document.createElement('div');this.tag.className='abs';this.tag.style.cssText='left:0;right:0;top:470px;text-align:center;font-weight:700;font-size:28px;opacity:.0';this.tag.textContent='Learn to read music, one little nugget at a time';r.appendChild(this.tag);
  this.st=makeStave(r,{clef:'treble',notes:['c/5','e/5','g/5'],scale:1.7,cx:640,cy:135,w:300,h:140});
  },update(t,L){this.words.forEach((w,i)=>pop(w,L,0.45+i*0.2,0.5,0.3));
   fade(this.tag,L,2.0,0.6);this.tag.style.opacity=String(prog(L,2.0,0.6)*0.8);
   this.st.heads.forEach((h,i)=>{const p=prog(L,0.9+i*0.35,0.4);h.sn.style.opacity=p;h.sn.style.transformBox='fill-box';h.sn.style.transformOrigin='50% 50%';h.sn.style.transform=`translateY(${(1-easeBack(p))*-30}px)`});
   this.st.box.style.opacity=prog(L,0.2,0.5)}};

S.hook={ui:{ribbon:1,hosts:'side',bubble:true},build(r){
  this.st=makeStave(r,{clef:'treble',notes:[],scale:3.6,w:330,cy:340,showClef:false});
  this.dots=[[0.07,2.3],[0.16,0.4],[0.24,3.6],[0.33,1.5],[0.41,2.9],[0.5,0.8],[0.58,3.3],[0.66,1.9],[0.74,0.2],[0.83,2.6],[0.9,1.2]].map(([fx,ln],i)=>{
    const d=document.createElement('div');d.className='abs';d.style.cssText='width:26px;height:20px;border-radius:50%;background:#241f3d;opacity:0';
    d.style.left=(this.st.x0+fx*(this.st.x1-this.st.x0))+'px';d.style.top=(this.st.lineY[0]+ln*this.st.sp-10)+'px';d.style.transform='rotate(-20deg)';r.appendChild(d);return d});
  this.q=document.createElement('div');this.q.className='big abs';this.q.style.cssText='left:0;right:0;top:482px;font-size:150px;color:var(--orange);opacity:0';this.q.textContent='?';r.appendChild(this.q);
  },update(t,L,c){const tq=wt('hook','wondered')-0.25,tf=wt('hook','find')-0.1;
   this.st.lines.forEach(l=>l.style.opacity=0.9);this.st.barlines.forEach(b=>b.style.opacity=1);
   this.dots.forEach((d,i)=>{const p=prog(t,CL.hook.start+0.6+i*0.12,0.3);d.style.opacity=clamp(p*2)*(t<tf?1:0);d.style.scale=String(lerp(0.3,1,easeBack(p)))});
   const p=prog(t,tq,0.4);const f=prog(t,tf,0.3);this.q.style.opacity=String(clamp(p*2)*(1-f));this.q.style.scale=String(lerp(0.4,1,easeBack(p))*(1+0.06*Math.sin(t*7)));this.q.style.rotate=Math.sin(t*5)*5+'deg'}};

S.today={ui:{ribbon:1,hosts:'side',bubble:false},build(r){
  this.chip=chip(r,'Nugget '+TL.nugget,'var(--orange)',640,128);
  this.a=document.createElement('div');this.a.className='big abs';this.a.style.cssText='left:0;right:0;top:200px;font-size:46px;font-family:Quicksand,sans-serif;font-weight:700';this.a.textContent=TL.todayLead||'Today we are going to learn';r.appendChild(this.a);
  this.b=document.createElement('div');this.b.className='big abs';this.b.style.cssText='left:0;right:0;top:290px;font-size:118px';this.b.textContent=TL.title;r.appendChild(this.b);
  },update(t,L,c){pop(this.chip,L,0.25,0.4);fade(this.a,L,0.45,0.5);const tm=(TL.titleAt?wt('today',TL.titleAt):CL.today.start+1.9)-0.2;this.b.style.opacity=prog(t,tm,0.3);this.b.style.scale=String(lerp(0.5,1,easeBack(prog(t,tm,0.55))));
   this.b.style.rotate=(1-prog(t,tm,0.7))*-4+'deg'}};

// shared: one stave for a group of scenes so they feel continuous
function staveScene(sceneDef){return sceneDef}
S.stave={ui:{ribbon:1,hosts:'side',bubble:true},build(r){
  this.st=makeStave(r,{clef:'treble',notes:[],scale:3.6,w:330,cy:335,showClef:false});
  this.nums=[];for(let i=0;i<5;i++){const n=document.createElement('div');n.className='num';n.textContent=i+1;n.style.left=(this.st.x0-56)+'px';n.style.top=(this.st.lineY[i]-17)+'px';r.appendChild(n);this.nums.push(n)}
  this.bars=this.st.lineY.map(y=>band(r,this.st.x0,this.st.x1,y-9,y+9,'rgba(45,212,191,.45)'));
  this.chip=chip(r,'5 lines','var(--orange)',this.st.x1-70,this.st.lineY[0]-80);
  },update(t,L,c){const T0=['n1','n2','n3','n4','n5'].map(k=>CL[k].start);
   this.st.barlines.forEach(b=>b.style.opacity=t>=CL.stave.start?1:0);
   this.st.lines.forEach((l,i)=>{const p=t<T0[i]?0.0:easeOut(prog(t,T0[i],0.4));setLine(l,p);if(t<T0[i]){l.style.opacity=0.16;l.style.transform='scaleX(1)'}
     lineWidth(l,t>=CL.stave.start&&t<CL.stave.end+0.5?(1+0.9*Math.abs(Math.sin((t-CL.stave.start)*5))):1)});
   this.nums.forEach((n,i)=>pop(n,t,T0[i],0.35,0.3));
   this.bars.forEach((b,i)=>{const d=t-T0[i];b.style.opacity=d<0?0:clamp(1-d/0.9)*0.9});
   if(t>=wt('stave','called')-0.05)c.caption('STAVE','#241f3d',wt('stave','called')-0.05);
   pop(this.chip,t,wt('stave','lines')-0.1,0.4)}};

function clefScene(kind){return {ui:{ribbon:1,hosts:'side',bubble:true},build(r){
  const bass=kind==='bass';
  this.st=makeStave(r,{clef:bass?'bass':'treble',notes:[],scale:3.6,w:330,cy:335});
  this.clefEl=this.st.clefEl;
  const cx=this.st.clefX, cy=this.st.lineY[2];
  this.h=halo(r,cx,cy,170,bass?'rgba(99,102,241,.55)':'rgba(45,212,191,.6)');
  this.chip=bass?chip(r,'↓ low sounds','var(--barnaby)',this.st.x1-190,this.st.lineY[4]+60):chip(r,'↑ high sounds','var(--melody-deep)',this.st.x1-200,this.st.lineY[4]+60);
  },update(t,L,c){const bass=kind==='bass';const k=bass?'bass':'clef1';const t0=bass?CL.bass.start+0.2:wt('clef1','swirly')-0.1;
   const p=prog(t,t0,0.5);this.clefEl.style.opacity=clamp(p*2);this.clefEl.style.transformBox='fill-box';this.clefEl.style.transformOrigin='50% 50%';this.clefEl.style.transform=`scale(${lerp(1.7,1,easeBack(p))})`;
   this.h.style.opacity=clamp(p*2)*(0.65+0.35*Math.sin(t*5));
   if(bass){if(t>=wt('bass','bass')-0.1)c.caption('BASS CLEF','var(--barnaby)',wt('bass','bass')-0.1);pop(this.chip,t,wt('bass','lower')-0.1,0.4)}
   else{ if(t<wt('clef2','treble')-0.1){if(t>=wt('clef1','clef')-0.15)c.caption('CLEF','#241f3d',wt('clef1','clef')-0.15)}else c.caption('TREBLE CLEF','var(--melody-deep)',wt('clef2','treble')-0.1);pop(this.chip,t,wt('clef2','higher')-0.1,0.4)}}}}
S.clef=clefScene('treble');S.bass=clefScene('bass');

S.note={ui:{ribbon:1,hosts:'side',bubble:true},build(r){
  this.st=makeStave(r,{clef:'treble',notes:['b/4'],scale:3.6,w:330,cy:335});
  const h=this.st.heads[0];this.h=halo(r,h.x,h.y,95,'rgba(245,158,11,.6)');h.color('#241f3d');
  },update(t,L,c){const h=this.st.heads[0],t0=wt('note','blob')-0.1;const p=prog(t,t0,0.5);
   h.sn.style.opacity=clamp(p*2);h.sn.style.transformBox='fill-box';h.sn.style.transformOrigin='50% 100%';h.sn.style.transform=`translateY(${(1-easeBack(p))*-70}px)`;
   this.h.style.opacity=clamp(p*2)*(0.7+0.3*Math.sin(t*6));
   if(t>=wt('note','note')-0.15)c.caption('NOTE','#b45309',wt('note','note')-0.15)}};

S.linespace={ui:{ribbon:1,hosts:'side',bubble:true},build(r){
  this.st=makeStave(r,{clef:'treble',notes:['g/4','c/5'],scale:3.6,w:330,cy:335});
  const [a,b]=this.st.heads;this.ha=halo(r,a.x,a.y,90,'rgba(13,148,136,.6)');this.hb=halo(r,b.x,b.y,90,'rgba(236,72,153,.55)');
  a.color('#0d9488');b.color('#be185d');
  this.bandA=band(r,this.st.x0,this.st.x1,this.st.lineY[3]-9,this.st.lineY[3]+9,'rgba(13,148,136,.5)');
  this.bandB=band(r,this.st.x0,this.st.x1,this.st.lineY[1]+8,this.st.lineY[2]-8,'rgba(236,72,153,.35)');
  this.ca=chip(r,'on a LINE','var(--melody-deep)',a.x+150,196);this.cb=chip(r,'in a SPACE','var(--pink)',b.x+160,196);
  },update(t,L,c){const [a,b]=this.st.heads;
   [[a,wt('line','line')-0.1,this.ha,this.ca,this.bandA],[b,wt('space','gap')-0.1,this.hb,this.cb,this.bandB]].forEach(([h,t0,hl,ch,bd],i)=>{
     const p=prog(t,t0,0.45);h.sn.style.opacity=clamp(p*2);h.sn.style.transformBox='fill-box';h.sn.style.transformOrigin='50% 100%';h.sn.style.transform=`translateY(${(1-easeBack(p))*-60}px)`;
     const live=i===0?(t<CL.space.start):true;hl.style.opacity=clamp(p*2)*(live?0.75+0.25*Math.sin(t*6):0.0);
     pop(ch,t,t0+0.15,0.4);ch.style.opacity=clamp(p*2)*(live?1:0.0);
     bd.style.opacity=live?clamp(p*2)*(0.55+0.3*Math.sin(t*5)):0});
   if(t<CL.space.start){if(t>=wt('line','line')-0.1)c.caption('LINE','var(--melody-deep)',wt('line','line')-0.1)}else if(t>=wt('space','which')-0.05)c.caption('SPACE','var(--pink)',wt('space','which')-0.05)}};

S.ledger={ui:{ribbon:1,hosts:'side',bubble:true},build(r){
  this.st=makeStave(r,{clef:'treble',notes:['a/5'],scale:3.6,w:330,cy:362});
  const h=this.st.heads[0];this.h=halo(r,h.x,h.y,100,'rgba(234,88,12,.55)');h.color('#c2410c');
  },update(t,L,c){const h=this.st.heads[0];const t0=wt('high','high')-0.2;const p=prog(t,t0,0.5);
   h.sn.style.opacity=clamp(p*2);h.sn.style.transformBox='fill-box';h.sn.style.transformOrigin='50% 100%';h.sn.style.transform=`translateY(${(1-easeBack(p))*-70}px)`;
   const led=h.ledger;const tl=wt('ledger','extra')-0.1;const q=easeOut(prog(t,tl,0.4));
   led.forEach(l=>{l.style.transformBox='fill-box';l.style.transformOrigin='50% 50%';l.style.transform=`scaleX(${q})`;l.style.opacity=t<tl?0:1;l.style.strokeWidth=t>=tl?String(1.4+1.2*Math.abs(Math.sin((t-tl)*5))*Math.max(0,1-(t-tl)/2.5)):'1'});
   this.h.style.opacity=clamp(p*2)*(0.6+0.35*Math.sin(t*6));
   if(t<CL.ledger.start){if(t>=wt('high','high')-0.1)c.caption('TOO HIGH!','#dc2626',wt('high','high')-0.1)}else if(t>=wt('ledger','ledger')-0.7)c.caption('LEDGER LINE','var(--orange)',wt('ledger','ledger')-0.7)}};

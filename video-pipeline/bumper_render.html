  :root {
    --ink: #241f3d;
    --melody: #2dd4bf;
    --melody-deep: #0d9488;
    --barnaby: #6366f1;
    --barnaby-deep: #1e1b4b;
    --pink: #ec4899;
    --yellow: #eab308;
    --accent: #ea580c;
    --stage-bg-mono: #14101f;
    --stage-bg-a: #fef3c7;
    --stage-bg-b: #bae6fd;
    --ease-pop: cubic-bezier(.34, 1.56, .64, 1);
    --ease-out: cubic-bezier(.22, .61, .36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; }
  body { font-family: 'Quicksand', sans-serif; }

  .stage {
    position: relative;
    width: 1280px; height: 720px;
    overflow: hidden;
    background: var(--stage-bg-mono);
    display: none;
  }
  .stage.shown { display: block; }
  .stage-bg-color {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%, var(--stage-bg-a) 0%, var(--stage-bg-b) 100%);
    opacity: 0;
  }

  /* Stave/clef graphics are rendered by VexFlow (notation.js), not hand-coded CSS -
     see notation-slot below. One continuous VexFlow stave can't carry two different
     clefs, so each side gets its own half-width stave positioned to visually abut. */
  .notation-slot { position: absolute; top: 58%; height: 28%; width: 42%; transform: translateY(-50%) scale(.85); opacity: 0; transition: opacity .6s ease, transform .6s var(--ease-pop); z-index: 3; }
  .notation-slot.notation-treble { left: 6%; }
  .notation-slot.notation-bass { right: 6%; }

  .seed-note { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.5); font-size: clamp(1.6rem, 5vw, 2.4rem); color: var(--yellow); text-shadow: 0 0 18px rgba(234, 179, 8, .9), 0 0 40px rgba(234, 179, 8, .5); opacity: 0; z-index: 4; }


  .mascot { position: absolute; top: 58%; width: 15%; max-width: 92px; z-index: 6; filter: drop-shadow(0 6px 10px rgba(0,0,0,.18)); opacity: 0; }
  .mascot svg { width: 100%; height: auto; display: block; }
  .mascot-melody { left: 26%; transform: translate(-50%,-50%); }
  .mascot-barnaby { right: 22%; transform: translate(50%,-50%); }

  .confetti { position: absolute; font-size: 1.2rem; opacity: 0; z-index: 4; }

  .title-card { position: absolute; left: 50%; top: 22%; transform: translate(-50%,-40%) scale(.6); font-family: 'Fredoka One', cursive; font-size: clamp(1.2rem, 4.4vw, 2rem); color: var(--barnaby-deep); text-align: center; text-shadow: 0 2px 0 rgba(255,255,255,.6); opacity: 0; z-index: 7; width: 84%; text-wrap: balance; }

  .outro-line { position: absolute; left: 50%; top: 20%; transform: translate(-50%, -30%); font-family: 'Fredoka One', cursive; font-size: clamp(1.1rem, 4vw, 1.7rem); color: var(--barnaby-deep); text-align: center; width: 82%; opacity: 0; z-index: 7; }
  .bell { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%) scale(.5); font-size: 1.8rem; opacity: 0; z-index: 7; }

  /* ================= INTRO animation ================= */
  .stage.playing .seed-note.intro-seed { animation: seedIntro 3.6s var(--ease-out) forwards; }
  @keyframes seedIntro { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); } 12% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 22% { transform: translate(-50%,-50%) scale(1.18); } 32% { transform: translate(-50%,-50%) scale(1); } 68% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 90% { opacity: 0; transform: translate(-50%,-50%) scale(.6); } 100% { opacity: 0; } }
  .stage.playing .stage-bg-color.intro-color { animation: fadeInColor 1.2s var(--ease-out) forwards; animation-delay: 2.6s; }
  @keyframes fadeInColor { from { opacity: 0; } to { opacity: 1; } }
  .stage.playing .notation-slot.intro-notation-t, .stage.playing .notation-slot.intro-notation-b { opacity: 1; transform: translateY(-50%) scale(1); transition-delay: 2.7s; }
  .stage.playing .mascot.intro-melody { animation-name: flyInLeft, idleBob; animation-duration: 1.1s, 2.4s; animation-delay: 4.2s, 5.3s; animation-iteration-count: 1, infinite; animation-timing-function: var(--ease-pop), ease-in-out; animation-direction: normal, alternate; animation-fill-mode: forwards, none; }
  .stage.playing .mascot.intro-barnaby { animation-name: flyInRight, idleBob; animation-duration: 1.1s, 2.6s; animation-delay: 4.4s, 5.5s; animation-iteration-count: 1, infinite; animation-timing-function: var(--ease-pop), ease-in-out; animation-direction: normal, alternate; animation-fill-mode: forwards, none; }
  @keyframes flyInLeft { from { opacity: 0; transform: translate(-160%,-50%) scale(.7); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
  @keyframes flyInRight { from { opacity: 0; transform: translate(160%,-50%) scale(.7); } to { opacity: 1; transform: translate(50%,-50%) scale(1); } }
  @keyframes idleBob { from { transform: translate(-50%,-50%) translateY(0); } to { transform: translate(-50%,-50%) translateY(-6%); } }
  .stage.playing .confetti.intro-c { animation: confettiIn 1.4s var(--ease-out) forwards; }
  @keyframes confettiIn { 0% { opacity: 0; transform: translateY(-40px) rotate(0deg); } 60% { opacity: 1; } 100% { opacity: 1; transform: translateY(0) rotate(20deg); } }
  .stage.playing .title-card.intro-title { animation: titlePop 1s var(--ease-pop) forwards; animation-delay: 6.2s; }
  @keyframes titlePop { from { opacity: 0; transform: translate(-50%,-40%) scale(.5); } to { opacity: 1; transform: translate(-50%,-40%) scale(1); } }

  /* ================= OUTRO animation ================= */
  .stage.outro-stage { background: radial-gradient(circle at 50% 40%, var(--stage-bg-a) 0%, var(--stage-bg-b) 100%); }
  .stage.outro-stage .mascot { opacity: 1; }
  .stage.outro-stage .notation-slot { opacity: 1; transform: translateY(-50%) scale(1); }
  .stage.playing .outro-line.line1 { animation: lineInOut 2.6s var(--ease-out) forwards; animation-delay: .3s; }
  .stage.playing .outro-line.line2 { animation: lineInOut 3s var(--ease-out) forwards; animation-delay: 3.3s; }
  @keyframes lineInOut { 0% { opacity: 0; transform: translate(-50%,-10%) scale(.7); } 18% { opacity: 1; transform: translate(-50%,-30%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-45%) scale(.92); } }
  .stage.playing .mascot.outro-melody { animation-name: wiggle, flyOutCenter; animation-duration: 1.1s, .9s; animation-delay: .5s, 9.3s; animation-iteration-count: 2, 1; animation-timing-function: ease-in-out, var(--ease-out); animation-fill-mode: none, forwards; }

  @keyframes wiggle { 0%,100% { transform: translate(-50%,-50%) rotate(0deg); } 25% { transform: translate(-50%,-50%) rotate(-6deg); } 75% { transform: translate(-50%,-50%) rotate(6deg); } }

<script>
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') === 'outro' ? 'outro' : 'intro';
  const stageId = mode === 'outro' ? 'outroStage' : 'introStage';
  const stage = document.getElementById(stageId);
  stage.classList.add('shown');

  // VexFlow-rendered clef+stave halves - drawn once, correctness guaranteed by
  // the library (no more hand-tuned clef font-size/position CSS).
  ['introNotationT', 'outroNotationT'].forEach((id) => {
    renderNotation(document.getElementById(id), Object.assign({}, STORYBOARD.bumperTreble.spec, { width: 480, height: 200 }));
  });
  ['introNotationB', 'outroNotationB'].forEach((id) => {
    renderNotation(document.getElementById(id), Object.assign({}, STORYBOARD.bumperBass.spec, { width: 480, height: 200 }));
  });

  window.startRender = function() {
    stage.classList.add('playing');
    const audio = document.getElementById('bumperAudio');
    audio.currentTime = 0;
    audio.play().catch(() => {});
  };
</script>

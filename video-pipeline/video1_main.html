  :root {
    --ink: #241f3d;
    --melody: #2dd4bf;
    --melody-deep: #0d9488;
    --barnaby: #6366f1;
    --barnaby-deep: #1e1b4b;
    --pink: #ec4899;
    --yellow: #eab308;
    --accent: #ea580c;
    --stage-bg-a: #fef3c7;
    --stage-bg-b: #bae6fd;
    --ease-pop: cubic-bezier(.34, 1.56, .64, 1);
    --ease-out: cubic-bezier(.22, .61, .36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; }
  body { font-family: 'Quicksand', sans-serif; }

  #stage {
    position: relative;
    width: 1280px; height: 720px;
    background: radial-gradient(circle at 50% 42%, var(--stage-bg-a) 0%, var(--stage-bg-b) 100%);
    overflow: hidden;
  }

  .scene { position: absolute; inset: 0; opacity: 0; transition: opacity .2s ease; }
  .scene.active { opacity: 1; }
  .scene.exiting { opacity: 0; }

  /* ---------- shared components ---------- */
  .mascot { position: absolute; width: 190px; opacity: 0; transform: scale(.6); filter: drop-shadow(0 8px 14px rgba(0,0,0,.18)); }
  .mascot svg { width: 100%; display: block; }
  .mascot.show { opacity: 1; transform: scale(1); transition: opacity .6s var(--ease-pop), transform .6s var(--ease-pop); }
  .mascot.bob { animation: bob 2.2s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0) scale(1); } to { transform: translateY(-14px) scale(1); } }

  /* Stave/clef/note/ledger graphics for scenes 3-7 are rendered by VexFlow
     (notation.js) into this one container per scene - not hand-coded CSS. */
  /* CSS box is sized to the SCALED (final on-screen) footprint - renderNotation
     is called with the smaller unscaled width/height + a scale factor (see
     notation.js), so this box must match width*scale / height*scale for the
     centering transform below to centre the actual visible content, not just
     the pre-scale coordinate box. */
  .notation-slot { position: absolute; left: 50%; top: 200px; width: 520px; height: 480px; transform: translateX(-50%); opacity: 0; transition: opacity .5s ease; }
  .notation-slot.show { opacity: 1; }

  /* Scene 2 only ("count the 5 lines with me") - a hand-drawn stave that
     reveals one line at a time in sync with the counting narration. This is
     a one-off teaching moment for THIS scene specifically, not the general
     notation renderer (which is VexFlow, see .notation-slot above) - keeping
     it hand-coded here is deliberate, not an oversight. */
  .stave { position: absolute; left: 160px; right: 160px; top: 300px; height: 180px; display: flex; flex-direction: column; justify-content: space-between; }
  .stave-line { position: relative; height: 4px; background: var(--barnaby-deep); opacity: 0; transform: scaleX(0); transform-origin: left; }
  .stave-line.show { opacity: .85; transform: scaleX(1); transition: opacity .3s ease, transform .5s var(--ease-out); }

  .num-tag { position: absolute; left: -46px; width: 34px; text-align: center; font-family: 'Fredoka One', cursive; font-size: 1.6rem; color: var(--accent); opacity: 0; transform: translateY(-50%) scale(.5); }
  .num-tag.show { opacity: 1; transform: translateY(-50%) scale(1); transition: opacity .3s ease, transform .35s var(--ease-pop); }


  .caption { position: absolute; left: 50%; top: 108px; transform: translate(-50%, -12px) scale(.6); font-family: 'Fredoka One', cursive; font-size: 3rem; color: var(--barnaby-deep); text-align: center; text-shadow: 0 2px 0 rgba(255,255,255,.6); opacity: 0; white-space: nowrap; }
  .caption.show { opacity: 1; transform: translate(-50%, 0) scale(1); transition: opacity .4s var(--ease-pop), transform .4s var(--ease-pop); }

  .term-flash { position: absolute; left: 50%; top: 62%; transform: translate(-50%,-50%) scale(.5); font-family: 'Fredoka One', cursive; font-size: 3.6rem; color: var(--accent); opacity: 0; text-align: center; text-shadow: 0 3px 0 rgba(255,255,255,.7); }
  .term-flash.show { opacity: 1; transform: translate(-50%,-50%) scale(1); transition: opacity .18s ease, transform .18s var(--ease-pop); }
  .term-icon { position: absolute; left: 50%; top: 30%; transform: translate(-50%,-50%) scale(.5); opacity: 0; }
  .term-icon.show { opacity: 1; transform: translate(-50%,-50%) scale(1); transition: opacity .18s ease, transform .18s var(--ease-pop); }

  .pulse { animation: pulseGlow 1s ease-in-out infinite; }
  @keyframes pulseGlow { 0%,100% { filter: drop-shadow(0 0 0 rgba(234,88,12,0)); } 50% { filter: drop-shadow(0 0 14px rgba(234,88,12,.6)); } }

  .cta { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%) scale(.6); font-family: 'Fredoka One', cursive; font-size: 2.2rem; color: #fff; background: var(--accent); padding: 18px 44px; border-radius: 999px; box-shadow: 0 8px 0 #b8450c; opacity: 0; text-align: center; }
  .cta.show { opacity: 1; transform: translateX(-50%) scale(1); transition: opacity .5s var(--ease-pop), transform .5s var(--ease-pop); }
</style>

    <div class="mascot" id="s7-barnaby" style="right:70px; top:330px; width:150px;"><span class="inner"></span></div>
    <div class="caption" id="s7-caption">LEDGER LINE</div>
  </div>

  <div class="scene" id="s8">
    <div class="term-icon" id="s8-icon"></div>
    <div class="term-flash" id="s8-term">STAVE</div>
  </div>

  <div class="scene" id="s9">
    <div class="mascot bob show" style="left:420px; top:280px; width:170px;"><span class="inner" id="s9-melody"></span></div>
    <div class="mascot bob show" style="right:420px; top:290px; width:190px;"><span class="inner" id="s9-barnaby"></span></div>
    <div class="caption show" style="top:120px;">Now it's your turn&hellip;</div>
  </div>

  <div class="scene" id="s10">
    <div class="mascot bob show" style="left:420px; top:280px; width:170px;"><span class="inner" id="s10-melody"></span></div>
    <div class="mascot bob show" style="right:420px; top:290px; width:190px;"><span class="inner" id="s10-barnaby"></span></div>
    <div class="cta show pulse">&#9654; Name That Part</div>
  </div>

  <audio id="narration" preload="auto" src="video1_full_preview.mp3"></audio>
</div>

<script src="vendor/vexflow.js"></script>
<script src="notation.js"></script>
<script src="storyboard_data.js"></script>
<script>
  const MELODY_SVG = `<svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="35" fill="#2dd4bf" />
            <path d="M 15,50 A 35,35 0 0,0 50,85 Z" fill="#0d9488" />
            <ellipse cx="40" cy="62" rx="15" ry="12" fill="#ccfbf1" />
            <circle cx="65" cy="40" r="7" fill="#ffffff" />
            <circle cx="67" cy="40" r="3.5" fill="#0f172a" />
            <circle cx="69" cy="38" r="1.5" fill="#ffffff" />
            <polygon points="75,45 90,48 78,55" fill="#fb923c" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M 25,50 C 20,40 35,35 45,50 C 40,60 30,60 25,50 Z" fill="#14b8a6" />
            <path d="M 40,18 Q 30,8 42,12 Q 54,8 44,18" fill="#2dd4bf" />
        </svg>`;
  const BARNABY_SVG = `<svg viewBox="0 0 100 100">
            <circle cx="25" cy="25" r="12" fill="#818cf8" />
            <circle cx="25" cy="25" r="7" fill="#c7d2fe" />
            <circle cx="75" cy="25" r="12" fill="#818cf8" />
            <circle cx="75" cy="25" r="7" fill="#c7d2fe" />
            <circle cx="50" cy="55" r="32" fill="#6366f1" />
            <circle cx="30" cy="62" r="5" fill="#f472b6" opacity="0.6" />
            <circle cx="70" cy="62" r="5" fill="#f472b6" opacity="0.6" />
            <ellipse cx="50" cy="68" rx="16" ry="11" fill="#e0e7ff" />
            <polygon points="46,63 54,63 50,68" fill="#1e1b4b" stroke="#1e1b4b" stroke-width="1" stroke-linejoin="round" />
            <path d="M 32,48 Q 40,40 42,48" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
            <path d="M 58,48 Q 60,40 68,48" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
        </svg>`;
  const melodyHosts = ['s1-melody','s3-melody','s9-melody','s10-melody'];
  const barnabyHosts = ['s4-barnaby','s7-barnaby','s9-barnaby','s10-barnaby'];
  function fillInner(id, svg) {
    const h = document.getElementById(id);
    if (!h) return;
    const target = h.classList.contains('inner') ? h : h.querySelector('.inner');
    if (target) target.innerHTML = svg;
  }
  melodyHosts.forEach(id => fillInner(id, MELODY_SVG));
  barnabyHosts.forEach(id => fillInner(id, BARNABY_SVG));

  // Measured directly from silencedetect on the real concatenated narration track,
  // not computed from individual clip durations — TTS clips have small variable
  // leading/trailing near-silence that made arithmetic timestamps drift ~0.1-0.15s
  // per line versus when the words actually start/stop. Line 8's SSML breaks were
  // widened enough that silencedetect now resolves each individual term's start
  // time too (see S8_TERM_TIMES below) instead of needing a word-count estimate.
  const BEATS = [
    { id: 's1', start: 0.000, end: 6.358 },
    { id: 's2', start: 7.159, end: 17.371 },
    { id: 's3', start: 18.210, end: 26.908 },
    { id: 's4', start: 27.718, end: 33.196 },
    { id: 's5', start: 34.002, end: 39.318 },
    { id: 's6', start: 40.136, end: 46.233 },
    { id: 's7', start: 47.028, end: 54.131 },
    { id: 's8', start: 54.941, end: 64.489 },
    { id: 's9', start: 65.282, end: 66.261 },
    { id: 's10', start: 67.056, end: 70.344 },
  ];

  let currentId = null;
  const sceneEls = {};
  BEATS.forEach(b => sceneEls[b.id] = document.getElementById(b.id));

  function activate(id) {
    if (id === currentId) return;
    if (currentId) sceneEls[currentId].classList.remove('active');
    sceneEls[id].classList.add('active');
    currentId = id;
    runSceneScript(id);
  }

  // Studio TTS voices don't support <mark> timepointing, so exact word-level sync
  // isn't available — instead we spread each scene's reveals as fractions of that
  // scene's real (measured) duration, so pacing scales with how long the line
  // actually takes to say instead of firing everything in the first ~1.5s and
  // then sitting idle for the remainder.
  function at(sceneId, fraction, fn) {
    const beat = BEATS.find(b => b.id === sceneId);
    const ms = fraction * (beat.end - beat.start) * 1000;
    setTimeout(fn, ms);
  }

  function runSceneScript(id) {
    if (id === 's1') {
      const m = document.getElementById('s1-melody');
      m.style.transform = 'translate(-140%, -50%)';
      m.style.opacity = '0';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        m.style.transition = 'transform .9s cubic-bezier(.34,1.56,.64,1), opacity .5s ease';
        m.style.transform = 'translate(-50%, -50%)';
        m.style.opacity = '1';
      }));
      at('s1', 0.22, () => m.classList.add('bob'));
    }
    if (id === 's2') {
      // "Music is written on five lines like this. Count them with me - one, two,
      // three, four, five. Five lines together are called a stave." The five
      // numbers cluster in the middle third; "stave" is the very last word.
      const lineFractions = [0.30, 0.42, 0.52, 0.62, 0.72];
      lineFractions.forEach((f, i) => {
        at('s2', f, () => {
          document.querySelector('#s2-stave .l' + (i + 1)).classList.add('show');
          document.querySelector('#s2-stave .n' + (i + 1)).classList.add('show');
        });
      });
      at('s2', 0.90, () => document.getElementById('s2-caption').classList.add('show'));
    }
    if (id === 's3') {
      renderNotation(document.getElementById('s3-notation'), Object.assign({}, STORYBOARD.s3.spec, { width: 280, height: 300, scale: 1.6 }));
      at('s3', 0.08, () => document.getElementById('s3-notation').classList.add('show'));
      at('s3', 0.30, () => {
        document.getElementById('s3-melody').classList.add('show');
        document.getElementById('s3-melody').classList.add('bob');
      });
      at('s3', 0.85, () => document.getElementById('s3-caption').classList.add('show'));
    }
    if (id === 's4') {
      renderNotation(document.getElementById('s4-notation'), Object.assign({}, STORYBOARD.s4.spec, { width: 280, height: 300, scale: 1.6 }));
      at('s4', 0.08, () => document.getElementById('s4-notation').classList.add('show'));
      at('s4', 0.30, () => {
        document.getElementById('s4-barnaby').classList.add('show');
        document.getElementById('s4-barnaby').classList.add('bob');
      });
      at('s4', 0.85, () => document.getElementById('s4-caption').classList.add('show'));
    }
    if (id === 's5') {
      renderNotation(document.getElementById('s5-notation'), Object.assign({}, STORYBOARD.s5.spec, { width: 280, height: 300, scale: 1.6 }));
      at('s5', 0.35, () => document.getElementById('s5-notation').classList.add('show'));
      at('s5', 0.60, () => document.getElementById('s5-caption').classList.add('show'));
    }
    if (id === 's6') {
      // Re-render with one more note when "space" is introduced, rather than
      // animating sub-elements inside the VexFlow SVG.
      const s6el = document.getElementById('s6-notation');
      renderNotation(s6el, Object.assign({}, STORYBOARD.s6_line.spec, { width: 340, height: 300, scale: 1.5 }));
      document.getElementById('s6-caption').textContent = 'LINE';
      at('s6', 0.10, () => {
        s6el.classList.add('show');
        document.getElementById('s6-caption').classList.add('show');
      });
      at('s6', 0.55, () => {
        document.getElementById('s6-caption').classList.remove('show');
      });
      at('s6', 0.62, () => {
        renderNotation(s6el, Object.assign({}, STORYBOARD.s6_lineAndSpace.spec, { width: 340, height: 300, scale: 1.5 }));
        document.getElementById('s6-caption').textContent = 'SPACE';
        document.getElementById('s6-caption').classList.add('show');
      });
    }
    if (id === 's7') {
      renderNotation(document.getElementById('s7-notation'), Object.assign({}, STORYBOARD.s7.spec, { width: 280, height: 300, scale: 1.6 }));
      at('s7', 0.30, () => document.getElementById('s7-notation').classList.add('show'));
      at('s7', 0.55, () => {
        document.getElementById('s7-barnaby').classList.add('show');
        document.getElementById('s7-barnaby').classList.add('bob');
      });
      at('s7', 0.80, () => document.getElementById('s7-caption').classList.add('show'));
    }
    if (id === 's8') {
      // Line 8's SSML now has deliberately wide breaks between each named term
      // (per Andrew's "too fast for a kid" feedback) - wide enough that
      // silencedetect resolves each term's actual start time directly, rather
      // than needing a word-count estimate. Absolute seconds, scene starts at
      // BEATS.s8.start = 54.941.
      // Each term also gets its actual musical symbol back (per Andrew's "all the
      // symbols have gone" feedback) - a small icon reusing the same VexFlow
      // renderer as scenes 3-7, not a hand-tuned div and not just the word alone.
      // VexFlow's glyph/line-spacing sizes are fixed pixel values regardless of
      // width/height (they don't scale to fill a box) - these heights are sized
      // generously enough that content never clips the SVG viewport, verified
      // directly against each icon's rendered bounding box, not eyeballed.
      const S8_TERM_TIMES = [
        { t: 'STAVE', spec: Object.assign({}, STORYBOARD.s8_stave.spec, { width: 220, height: 150 }), at: 56.929 },
        { t: 'CLEF', spec: Object.assign({}, STORYBOARD.s8_clef.spec, { width: 120, height: 240 }), at: 58.210 },
        { t: 'NOTE', spec: Object.assign({}, STORYBOARD.s8_note.spec, { width: 100, height: 220 }), at: 59.317 },
        { t: 'LINE / SPACE', spec: Object.assign({}, STORYBOARD.s8_lineSpace.spec, { width: 240, height: 245 }), at: 60.422 },
        { t: 'LEDGER LINE', spec: Object.assign({}, STORYBOARD.s8_ledger.spec, { width: 150, height: 240 }), at: 62.069 },
      ];
      const el = document.getElementById('s8-term');
      const iconEl = document.getElementById('s8-icon');
      el.classList.remove('show');
      iconEl.classList.remove('show');
      const beat = BEATS.find(b => b.id === 's8');
      S8_TERM_TIMES.forEach(({ t, spec, at }, i) => {
        const showMs = (at - beat.start) * 1000;
        setTimeout(() => {
          el.textContent = t; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
          renderNotation(iconEl, spec);
          iconEl.classList.remove('show'); void iconEl.offsetWidth; iconEl.classList.add('show');
        }, showMs);
        // hide shortly before the next term so there's a visible blank beat
        // matching the audio's pause, rather than terms bleeding into each other
        const next = S8_TERM_TIMES[i + 1];
        if (next) {
          const hideMs = (next.at - beat.start) * 1000 - 220;
          setTimeout(() => { el.classList.remove('show'); iconEl.classList.remove('show'); }, hideMs);
        }
      });
    }
  }

  const audio = document.getElementById('narration');
  function tick() {
    const t = audio.currentTime;
    // Find the most recently *started* beat, so gaps between scenes (the ~0.5-0.8s
    // silence between narration lines) hold on the previous scene instead of an
    // undefined fallback — a fallback bug here previously caused a flash back to
    // scene 1 during every inter-scene gap.
    let b = BEATS[0];
    for (const beat of BEATS) {
      if (t >= beat.start) b = beat;
      else break;
    }
    activate(b.id);
    if (!audio.paused || !audio.ended) requestAnimationFrame(tick);
  }

  // Hooks for check.mjs — not used by playback itself.
  window.__BEATS_FOR_CHECK__ = BEATS;
  window.__pickBeatForCheck__ = function(t) {
    let b = BEATS[0];
    for (const beat of BEATS) {
      if (t >= beat.start) b = beat;
      else break;
    }
    return b.id;
  };
  window.__runSceneScriptForCheck__ = runSceneScript;

  window.startShow = function() {
    activate('s1');
    audio.currentTime = 0;
    audio.play().catch(() => {});
    requestAnimationFrame(tick);
  };
</script>
